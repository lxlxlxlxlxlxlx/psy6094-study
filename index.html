<script id="bank" type="application/json">[{"id":"4-flash-1","lesson":4,"kind":"flash","num":1,"q":"谁在什么年代提出了神经多样性的概念？","a":"Judy Singer；20 世纪 90 年代末。","source":"L4 第 2 页","p":6,"hook":"先说出名字，再把时间定位到“90 年代末”。"},{"id":"4-flash-2","lesson":4,"kind":"flash","num":2,"q":"为什么把 ASD、ADHD、读写障碍和 OCD 放在一起研究？","a":"高共病；共享遗传、分子和回路基础；跨诊断研究价值。","source":"L4 第 3 页","p":6},{"id":"4-flash-3","lesson":4,"kind":"flash","num":3,"q":"mTOR、Wnt/β-catenin、PI3K-AKT 各自与哪些过程有关？","a":"mTOR：生长代谢；Wnt/β-catenin：迁移、极性、分层；PI3K-AKT：mTOR上游、生存生长。","source":"L4 第 6–7 页","p":6},{"id":"4-flash-4","lesson":4,"kind":"flash","num":4,"q":"精准神经多样性框架有哪三个步骤？","a":"多模态评估→与常模比较并分层→个性化支持。","source":"L4 第 11–13 页","p":6},{"id":"4-flash-5","lesson":4,"kind":"flash","num":5,"q":"执行、社交、注意和感觉分别涉及哪些网络？","a":"执行 FPN/CON；社交 DMN/镜像；注意 DAN/VAN；感觉皮层/SN。","source":"L4 第 11 页","p":6},{"id":"4-flash-6","lesson":4,"kind":"flash","num":6,"q":"LTP 和 LTD 分别表示突触连接怎样改变？","a":"LTP 持久增强；LTD 减弱。","source":"L4 第 17 页","p":6},{"id":"4-flash-7","lesson":4,"kind":"flash","num":7,"q":"课程提出的四种复习策略是什么？","a":"间隔重复、交叉学习、主动回忆、合作学习。","source":"L4 第 21 页","p":6},{"id":"4-flash-8","lesson":4,"kind":"flash","num":8,"q":"补偿性可塑性和认知储备有何区别？","a":"补偿：其他回路支持当前受限功能；储备：长期学习等形成抵御衰退的能力。","source":"L4 第 22 页","p":6},{"id":"4-flash-9","lesson":4,"kind":"flash","num":9,"q":"第 4 课 tDCS 案例报告了哪些电流与行为表现数字？","a":"通常 1–2mA；正确率约提高 12%；反应时间约缩短 130 毫秒。","source":"L4 第 27–29 页","p":6},{"id":"4-flash-10","lesson":4,"kind":"flash","num":10,"q":"课程用哪五点总结神经可塑性？","a":"终身存在、学习重塑、用进废退、最优挑战、个体差异。","source":"L4 第 26 页","p":6},{"id":"5-flash-1","lesson":5,"kind":"flash","num":1,"q":"五篇论文各研究了什么？试着把作者与主题配对。","a":"Tamon：ASD/ADHD 脑区比较；Le Cunff：负荷多模态；Lou：读写白质；Luo：ADHD 异质性；Lage：ASD 灵活性。","source":"L5A 第 1 页；L5B 第 20 页","p":7,"hook":"先把 Lou 和 Luo 分开记：Lou 看读写白质，Luo 看 ADHD 异质性。"},{"id":"5-flash-2","lesson":5,"kind":"flash","num":2,"q":"Tamon 研究中，ASD 和 ADHD 共有的两个高活化、两个低活化脑区分别是什么？","a":"高：右舌回、右直回；低：左 MFG、左 STG。","source":"L5A 第 4 页","p":7},{"id":"5-flash-3","lesson":5,"kind":"flash","num":3,"q":"Lou 的读写障碍白质研究中，两组人数、子网规模和校正后的 p 值分别是多少？","a":"26 对 31 人；左侧 8 节点 7 边；NBS 校正 p=.023。","source":"L5A 第 9 页","p":7},{"id":"5-flash-4","lesson":5,"kind":"flash","num":4,"q":"GE、CC、LE 和 T 四个图论指标分别看什么？","a":"GE 看长程整合；CC 看邻近密度；LE 看局部效率；T 看局部传递性。","source":"L5A 第 11 页","p":7},{"id":"5-flash-5","lesson":5,"kind":"flash","num":5,"q":"ADHD 的四种模型分别由谁在哪一年提出？","a":"双通路 Sonuga-Barke 2003；抑制 Barkley 1997；CEM Sergeant 2000；发育双重分离 Halperin 与 Schulz 2006。","source":"L5A 第 17–19 页","p":7},{"id":"5-flash-6","lesson":5,"kind":"flash","num":6,"q":"从旧规则切换到新规则，需要哪四步？","a":"掌握旧规则→收到变化反馈→抑制旧规则→提取并使用新规则。","source":"L5B 第 1 页","p":7},{"id":"5-flash-7","lesson":5,"kind":"flash","num":7,"q":"解释 ASD 转换困难的三种理论，各关注什么？","a":"单聚焦看注意分配；弱中央统合看局部/全局；贝叶斯看先验和不确定性。","source":"L5B 第 5–6 页","p":7},{"id":"5-flash-8","lesson":5,"kind":"flash","num":8,"q":"Theta、Alpha 的频率范围和 P300 的出现时间分别是什么？","a":"Theta4–8Hz；Alpha8–12Hz；P300 约 300ms。","source":"L5B 第 8 页","p":7},{"id":"5-flash-9","lesson":5,"kind":"flash","num":9,"q":"读写障碍、ADHD 和 ASD 分别可以获得哪些课堂支持？","a":"阅读：规则讲明、分段多感官；ADHD：节奏、活动、即时反馈；ASD：预告、提示、兴趣。","source":"L5B 第 12–17 页","p":7},{"id":"5-flash-10","lesson":5,"kind":"flash","num":10,"q":"三种认知负荷和 UDL 三原则分别是什么？","a":"负荷：内在、外在、相关；UDL：多种表征、多种行动与表达、多种参与。","source":"L5B 第 11 页、18","p":7},{"id":"6-flash-1","lesson":6,"kind":"flash","num":1,"q":"通用学习设计（UDL）用哪三个问题对应三项原则？","a":"学什么→表征；怎样展示→行动与表达；为什么愿意学→参与。","source":"L6A 第 3 页","p":7,"hook":"备一节课时连问三句：学生怎么看懂？怎么展示？为什么愿意学？"},{"id":"6-flash-2","lesson":6,"kind":"flash","num":2,"q":"差异化教学（DI）根据哪三类信息，调整哪三方面？","a":"准备度／兴趣／学习概况；内容／过程／成果。","source":"L6A 第 4 页","p":7},{"id":"6-flash-3","lesson":6,"kind":"flash","num":3,"q":"关于 UDL 和 DI 的关系，综述中的三种观点各占多少？","a":"互补 37%；嵌入 48%；不相容 15%。","source":"L6A 第 5 页","p":8},{"id":"6-flash-4","lesson":6,"kind":"flash","num":4,"q":"Boysen 对 UDL 脑科学依据的审查支持什么结论？","a":"神经映射证据不足，要继续用课堂与学习结果评价具体方法。","source":"L6A 第 9–14 页","p":8},{"id":"6-flash-5","lesson":6,"kind":"flash","num":5,"q":"CALM 资料的三个认知因素分别与哪些学业表现相关？","a":"语音加工—阅读；执行功能—数学；加工速度—广泛学业。","source":"L6A 第 17 页","p":8},{"id":"6-flash-6","lesson":6,"kind":"flash","num":6,"q":"跨诊断视角怎样转化为教育支持？","a":"看实际功能画像、按需分层支持、避免诊断遮蔽。","source":"L6A 第 20 页","p":8},{"id":"6-flash-7","lesson":6,"kind":"flash","num":7,"q":"Lotfi 研究在哪三个时间点评估？怎样区分近期改变和延迟迁移？","a":"基线→训练后→6 个月；区分近期认知改变与延迟阅读迁移。","source":"L6B 第 3–4 页","p":8},{"id":"6-flash-8","lesson":6,"kind":"flash","num":8,"q":"PIT 的四个维度分别用什么工具评价？","a":"多样性 SCCI；支持所有人 TSR；协作日志；专业成长 SAED。","source":"L6B 第 8 页","p":8},{"id":"6-flash-9","lesson":6,"kind":"flash","num":9,"q":"Bandura 提出的自我效能感四个来源是什么？","a":"掌握经验、替代经验、言语劝说、生理与情绪状态。","source":"L6B 第 11 页","p":8},{"id":"6-flash-10","lesson":6,"kind":"flash","num":10,"q":"面对脑科学教学主张，可以做哪三项核查？","a":"相关≠因果；警惕 VAK 匹配；检查学业效果证据。","source":"L6B 第 18 页","p":8},{"id":"7-flash-1","lesson":7,"kind":"flash","num":1,"q":"NIES 如何把神经原理转成课堂策略？依次说出四步。","a":"辨识神经原理→界定大脑功能属性→建立教学导向→发展课堂策略。","source":"L7A 第 3–4 页","p":8,"hook":"四步分别回答：依据什么原理？涉及什么功能？往哪个方向教？课堂具体怎么做？"},{"id":"7-flash-2","lesson":7,"kind":"flash","num":2,"q":"顶内沟（IPS）和左角回（AG）在数学任务中的重点功能是什么？","a":"IPS：数量表征；左 AG：已学算术事实提取。","source":"L7A 第 9–10 页","p":8},{"id":"7-flash-3","lesson":7,"kind":"flash","num":3,"q":"反应性介入（RTI）的三层支持如何逐步加强？","a":"全员普及→小组补充→个别密集；支持与追踪逐层加强。","source":"L7A 第 18–19 页","p":8},{"id":"7-flash-4","lesson":7,"kind":"flash","num":4,"q":"动态评估（DA）与具象到抽象（CRA）各按什么顺序进行？","a":"DA：测—教—再测；CRA：具体—表征—抽象。","source":"L7B 第 1–2 页","p":8},{"id":"7-flash-5","lesson":7,"kind":"flash","num":5,"q":"第 7 课数学教学里的 DSM 指什么？整合了哪些支持？","a":"Dynamic Strategic Math，动态策略数学；整合语言、解题策略和元认知。","source":"L7B 第 2–3 页","p":8},{"id":"7-flash-6","lesson":7,"kind":"flash","num":6,"q":"课堂上逐步把责任交给学生，经历哪四步？","a":"I do→We do→You do together→You do alone。","source":"L7B 第 5 页","p":8},{"id":"7-flash-7","lesson":7,"kind":"flash","num":7,"q":"课件中的个别化教育计划（IEP）如何写出工具、任务和达成率？","a":"用 Cuisenaire 数棒完成 10 以内数字分解，达成率 85%。","source":"L7A 第 19 页","p":9},{"id":"7-flash-8","lesson":7,"kind":"flash","num":8,"q":"自我决定理论（SDT）提出哪三项基本心理需要？","a":"胜任感、自治感、关联感。","source":"L7B 第 10 页","p":9},{"id":"7-flash-9","lesson":7,"kind":"flash","num":9,"q":"教师调查中，工作负担、经费和行为情绪问题占比分别是多少？","a":"工作负担 42%；经费 19%；行为情绪 13%。","source":"L7B 第 14 页","p":9},{"id":"7-flash-10","lesson":7,"kind":"flash","num":10,"q":"本课主张怎样把脑科学研究用到特殊教育实践？","a":"原则要落到具体支持；看效果与情境；科学帮助反思，家校与教师共同参与。","source":"L7B 第 17–19 页","p":9},{"id":"8-flash-1","lesson":8,"kind":"flash","num":1,"q":"SETT 选辅助工具时依次考虑哪四项？贯穿四项的要求是什么？","a":"Student 学生—Environments 环境—Tasks 任务—Tools 工具；四项都要文化回应。","source":"L8A 第 5–6 页","p":9,"hook":"设想在教室里选辅助工具：谁要用？在哪用？做什么？最后才挑工具。"},{"id":"8-flash-2","lesson":8,"kind":"flash","num":2,"q":"资料把教育神经技术分为哪五类？","a":"测量、神经反馈、物理神经调控、BCI、AI 赋能。","source":"L8A 第 9 页","p":9},{"id":"8-flash-3","lesson":8,"kind":"flash","num":3,"q":"主动和被动脑机接口（BCI）有何区别？资料中的占比各是多少？","a":"主动有意发指令；被动隐式读取状态。资料比例 84.2%与 15.8%。","source":"L8A 第 15 页","p":9},{"id":"8-flash-4","lesson":8,"kind":"flash","num":4,"q":"脑机接口（BCI）和经颅直流电刺激（tDCS）的作用有何区别？","a":"BCI 读取脑信号并支持外部控制/适应；tDCS 调节皮层膜电位和兴奋性。","source":"L8A 第 20 页；L8B 第 1 页","p":9},{"id":"8-flash-5","lesson":8,"kind":"flash","num":5,"q":"本课 tDCS 综述纳入多少项随机对照研究、多少人和多少次刺激？","a":"35 项 RCT、745 人、累计 6,587 次刺激；只描述该综述研究范围。","source":"L8B 第 1–2 页","p":9},{"id":"8-flash-6","lesson":8,"kind":"flash","num":6,"q":"儿童 tDCS 研究还有哪五个缺口？","a":"个体滴定、电场建模、睡眠节律、亚型、课堂生态。","source":"L8B 第 9 页","p":9},{"id":"8-flash-7","lesson":8,"kind":"flash","num":7,"q":"自适应教学系统的三层如何形成闭环？","a":"感知→决策→反馈；对准 ZPD、负荷与支持。","source":"L8B 第 14 页","p":9},{"id":"8-flash-8","lesson":8,"kind":"flash","num":8,"q":"课程列出的五项神经权利是什么？","a":"精神隐私、精神完整、心理自主、公平增强、反算法偏见。","source":"L8B 第 16 页","p":9},{"id":"8-flash-9","lesson":8,"kind":"flash","num":9,"q":"怎样尊重学生持续表达的同意或拒绝？","a":"多模态解释＋持续观察意愿＋尊重身体拒绝＋随时可撤回。","source":"L8B 第 17 页","p":9},{"id":"8-flash-10","lesson":8,"kind":"flash","num":10,"q":"评价一项教育神经技术，要同时看哪两条标准？","a":"科学有效性与教育相关性；还须看真实课堂可用性。","source":"L8A 第 13 页","p":10},{"id":"9-flash-1","lesson":9,"kind":"flash","num":1,"q":"认知负荷理论（CLT）中的三种负荷分别来自哪里？","a":"内在＝内容交互复杂度；外在＝呈现和干扰；有效＝图式构建与深度理解投入。","source":"L9A 第 5 页","p":10,"hook":"先找负荷来自哪里：内容本身、呈现干扰，还是为形成理解而投入的努力？"},{"id":"9-flash-2","lesson":9,"kind":"flash","num":2,"q":"情绪设计要抓住哪三点？要避免什么干扰？","a":"安全第一、动机驱动、平衡唤醒；避免无关诱惑细节。","source":"L9A 第 13 页","p":10},{"id":"9-flash-3","lesson":9,"kind":"flash","num":3,"q":"CEN-STEM 和 CIRCLE 两个框架各有怎样的结构？","a":"前者四组十原则；后者五层全纳课程结构。编号与全称有页间差异，要按页记。","source":"L9A 第 14–19 页","p":10},{"id":"9-flash-4","lesson":9,"kind":"flash","num":4,"q":"从内到外，CIRCLE 的五层是什么？","a":"基础→社会情感→认知→教学→技能。","source":"L9A 第 14 页、17–19","p":10},{"id":"9-flash-5","lesson":9,"kind":"flash","num":5,"q":"自适应教学的六步循环依次是什么？","a":"动态诊断→教学适配→主动加工→分布提取→形成反馈→监控校准。","source":"L9B 第 4 页","p":10},{"id":"9-flash-6","lesson":9,"kind":"flash","num":6,"q":"在本课 UDL 框架中，What、How、Why 分别对应哪些网络和原则？","a":"识别 What→表征；策略 How→表达；情感 Why→参与。","source":"L9B 第 6 页","p":10},{"id":"9-flash-7","lesson":9,"kind":"flash","num":7,"q":"怎样安排一次兼顾难度、反馈和时间间隔的提取练习？","a":"主动回想，低风险，适度费力，配反馈，跨时间再提取。","source":"L9B 第 1–4 页","p":10},{"id":"9-flash-8","lesson":9,"kind":"flash","num":8,"q":"课例的三轮教案分别改进了什么？","a":"共享多感官材料→点读笔及图标检核→面包店、立体手偶和同伴角色扮演。","source":"L9B 第 7–10 页","p":10},{"id":"9-flash-9","lesson":9,"kind":"flash","num":9,"q":"CPA 数学教学的三个阶段依次是什么？","a":"Concrete 实物→Pictorial 图示→Abstract 抽象。","source":"L9B 第 13 页","p":10},{"id":"9-flash-10","lesson":9,"kind":"flash","num":10,"q":"普通教育与特殊教育协作的五个支柱是什么？","a":"平等互信、共同价值、合理分工、双周研讨、反思迭代。","source":"L9B 第 15 页","p":10},{"id":"4-short-1","lesson":4,"kind":"short","num":1,"q":"什么是神经多样性？它与缺陷模型有什么区别？","points":["神经多样性指人类脑功能存在自然且有价值的差异。资料把 ASD、ADHD 和读写障碍理解为认知谱系中的不同表现。","缺陷模型主要关注病理、症状、矫正和符合标准；差异模型关注个体优势、接纳和环境适配。","教育上应了解学生的具体需要和优势，设计包容、灵活的支持。概念来源可写 Judy Singer，20世纪 90 年代末。"],"hint":"自然变异 · 谱系 · 缺陷与差异 · 环境适配","source":"L4 第 2 页","p":20,"end":20},{"id":"4-short-2","lesson":4,"kind":"short","num":2,"q":"为什么把 ASD、ADHD、读写障碍和 OCD 放在一起研究？","points":["它们经常共病，提示可能存在共享机制。","资料指出，它们在遗传风险、分子通路和神经回路上存在重叠。","多数相关状况涉及许多小效应基因变异；基因多效性又使一个基因可影响多种表型。","因此，跨诊断研究可超越单一标签，寻找共同机制，同时保留个体差异。"],"hint":"共病 · 共享基础 · 多基因 · 多效性 · 跨诊断","source":"L4 第 3–7 页","p":20,"end":20},{"id":"4-short-3","lesson":4,"kind":"short","num":3,"q":"列出资料中的三类共享分子机制与三条信号通路。","points":["共享分子机制包括突触功能、染色质重塑和免疫相关过程。突触例子有 SHANK3、NRXN1 和NLGN3/4；染色质例子有 CHD8、ARID1B 和 SETD1A；免疫例子有小胶质细胞、星形胶质细胞以及 C1q、C3。","mTOR 调控生长、增殖和代谢，并关系到突触可塑性。","Wnt/β-catenin 参与神经元迁移、极性和皮层分层。","PI3K-AKT 位于 mTOR 上游，参与神经元存活、生长和抗凋亡。相互关联的通路有助于解释症状重叠。"],"hint":"突触 · 染色质 · 免疫 · mTOR · Wnt/β-catenin · PI3K-AKT","source":"L4 第 4–7 页","p":21,"end":21},{"id":"4-short-4","lesson":4,"kind":"short","num":4,"q":"什么是精准神经多样性？资料提出的三步框架是什么？","points":["精准神经多样性强调，同一诊断下存在不同神经特征，应结合行为和脑网络描述个体需要。","第一步是多模态评估，收集量表、神经心理测试、家长教师报告、发育环境历史以及 T1、rs-fMRI、DTI。","第二步是与年龄匹配常模比较，使用网络指标量化偏差并分层。","第三步是匹配个性化支持。课件将低、中、高偏差分别关联到标准行为教育支持、增强认知训练或神经反馈、药物或神经调控及监测。","原阈值为 Z\u003c1、1\u003cZ\u003c2、Z>2；资料没有规定 Z 恰等于 1 或 2 的处理。"],"hint":"个体差异 · 多模态 · 常模 · 分层 · 匹配支持","source":"L4 第 8–13 页","p":21,"end":21},{"id":"4-short-5","lesson":4,"kind":"short","num":5,"q":"把脑网络研究用于实际决策，会遇到哪些问题？","points":["结果可能随分析流程改变，因此需要预注册、开放数据和代码以及标准化流程来提高可重复性。","训练中若混入测试集信息，会夸大模型表现，因此需要严格交叉验证。","大量可选分析容易产生挑选阳性结果的问题，需要多重比较校正和效应量报告。","伦理上应保护隐私、落实知情同意，防止神经歧视和新的标签等级。","落地还需纵向验证、可使用的工具、较低成本、专业培训和政策支持。"],"hint":"可重复性 · 数据泄露 · 交叉验证 · 分析自由度 · 隐私 · 落地","source":"L4 第 14–15 页","p":21,"end":21},{"id":"4-short-6","lesson":4,"kind":"short","num":6,"q":"解释三类神经可塑性，并区分 LTP 与 LTD。","points":["神经可塑性是大脑随经验调整连接、适应和重组自身的能力。","突触可塑性是连接强弱改变；结构可塑性是神经元、树突和突触等结构改变；功能可塑性是区域间功能承担的重组。","Hebb 理论认为共同激活可使连接加强，说明重复练习为什么会强化回路。","LTP 指连接持久增强，资料将其与学习记忆联系；LTD 指连接减弱，资料将其与遗忘和网络优化联系。","例子可写新突触或灰质变化属于结构指标，中风后的功能协助属于功能重组。"],"hint":"经验 · 突触 · 结构 · 功能 · Hebb · LTP · LTD","source":"L4 第 17–18 页","p":21,"end":22},{"id":"4-short-7","lesson":4,"kind":"short","num":7,"q":"怎样用认知负荷和神经可塑性解释有效复习？","points":["资料提出倒 U 型关系：负荷太低缺少挑战，太高超过工作记忆容量，适度挑战更有利。","间隔重复在不同时间重新激活记忆；交叉学习混合主题以练习区分和迁移。","主动回忆通过测试练习提取，合作学习通过讨论和教别人促进理解。","学习同时涉及 PFC 的注意与工作记忆、海马体的形成与巩固，以及杏仁核参与的情绪和动机。","因此，复习应调节难度，并安排提取、间隔和反馈，而不是只延长阅读时间。"],"hint":"倒 U 型 · 工作记忆 · 间隔 · 交叉 · 主动回忆 · 合作","source":"L4 第 19–21 页","p":22,"end":22},{"id":"4-short-8","lesson":4,"kind":"short","num":8,"q":"补偿性可塑性和认知储备分别是什么？举资料中的例子。","points":["补偿性可塑性指某区域或回路受限时，其他区域或回路可增强作用来支持功能。","资料中的教育例子包括读写障碍使用颜色编码和思维导图，ASD 使用结构化环境、视觉支持和减少感官刺激。","认知储备是通过教育、持续学习和解决问题建立较强且高效的回路，以支持抵御老化或病理影响。","资料列出的储备活动有学习新语言、复杂社交、棋类或乐器等脑力挑战以及规律有氧运动。","两者共同说明教育应支持个人优势和持续发展，但侧重点分别是功能支持与长期抵御能力。"],"hint":"其他回路支持 · 个性化 · 认知储备 · 持续学习 · 老龄化","source":"L4 第 20–22 页、34","p":22,"end":22},{"id":"4-short-9","lesson":4,"kind":"short","num":9,"q":"概述资料中 tDCS 案例的设计、结果和神经支持假说。","points":["tDCS 用通常 1–2mA 的弱直流电调节兴奋性。实验包括基线、随机分组、双盲真/假刺激、任务和即时及追踪测试。","课件报告高负荷下真刺激组 DLPFC 激活较低、额顶连接较强，同时正确率提高约 12%、反应时间缩短约 130 毫秒。","神经支持假说认为，高负荷使额顶资源接近上限，刺激提高 DLPFC 基准兴奋性，帮助维持处理效率。","因此，较低激活结合较好表现，可被解释为神经效率提高；不能只凭激活高低判断效果。","这些结果属于资料所述案例，并不是对所有人和任务的统一承诺。"],"hint":"随机 · 双盲 · 假刺激 · DLPFC · 神经支持 · 神经效率","source":"L4 第 27–30 页","p":22,"end":23},{"id":"4-short-10","lesson":4,"kind":"short","num":10,"q":"为什么认知增强和脑技术不能采用同一方案用于所有学生？","points":["资料中的 tDCS 效果受基线能力影响：低基线者较可能获益，高基线者可能无明显改善或受干扰。","不同人的颅骨等生理差异会影响实际电流，电极位置、强度和时间也尚未统一。","儿童和青少年发育中的长期安全性，以及重复使用的长期效果，需要进一步研究。","教育应用还涉及知情同意、公平、可及性及可能的意外影响。","因此，资料强调个体差异、审慎评估，并提高教师的神经科学素养。"],"hint":"基线 · 个体差异 · 标准化 · 长期安全 · 公平 · 知情同意","source":"L4 第 25–26 页、29–30","p":23,"end":23},{"id":"5-short-1","lesson":5,"kind":"short","num":1,"q":"为什么比较 ASD 与 ADHD 时要控制任务选择偏差？Tamon 等发现什么？","points":["既有 ADHD 研究常采用抑制任务，ASD 研究常采用社会情绪任务；如果直接比较，任务不同可能混入诊断差异。","资料介绍 Tamon 等（2024）按 RDoC 维度分层，平衡任务及效应方向，并做 10,000 次均衡子抽样 ALE。","纳入 243 项研究、12,533 人，使用聚类水平 FWE 校正。","结果包括共有的右舌回、右直回高活化，以及左 MFG、左 STG 低活化；同时，控制偏差后特异性异常更多。","因此，应同时理解共性与差异；共享学习支持需要不等于两种诊断可以直接合并。"],"hint":"任务偏差 · RDoC · ALE · 共享 · 特异 · 不直接合并","source":"L5A 第 2–6 页；L5B 第 13 页","p":36,"end":36},{"id":"5-short-2","lesson":5,"kind":"short","num":2,"q":"Lou 等研究怎样支持从连接网络理解读写障碍？","points":["研究使用 DTI 连接组、NBS 与图论，比较 26 名读写障碍儿童和 31 名对照。","发现左侧枕–颞–顶局部子网络连接较弱，含 8 节点、7 条边，涉及语音和正字法阅读通路。","子网 FA 较低，而全脑平均 FA 没有显著组间差异，所以资料强调局部网络特异性。","两组仍保留小世界结构，不能说读写障碍大脑完全没有有效网络组织。","GE、CC、LE、T 与识字成绩正相关；资料据此讨论跨区整合与局部专门加工在阅读中的作用。"],"hint":"DTI · NBS · 8 节点 7 边 · 局部 FA · 小世界 · 整合与分离","source":"L5A 第 8–13 页","p":37,"end":37},{"id":"5-short-3","lesson":5,"kind":"short","num":3,"q":"解释 GE、CC、LE、T，并区分相关系数和增量解释量。","points":["GE 是全域效率，衡量分散区域间长程并行信息传输，属于整合指标。","CC 是聚类系数，反映邻近节点互联密度；LE 是局部效率，关注局部子网容错和专门处理；T 是传递性，反映模块内连接品质。","课件图示识字相关分别为 GE .69、CC .69、LE .70、T .62。相关系数描述两项变量共同变化的程度。","分层回归的增量 ΔR² 描述增加一组指标后额外解释多少变异；课件列 CC 和 LE 各 7.2%、GE6.5%。","因此，不能把 r=.69 写成额外解释 69%的识字差异。"],"hint":"GE · CC · LE · T · r · ΔR²","source":"L5A 第 11–13 页","p":37,"end":37},{"id":"5-short-4","lesson":5,"kind":"short","num":4,"q":"用四种模型说明为什么 ADHD 不能只有一种解释。","points":["双通路模型区分背侧认知控制路线与腹侧动机奖赏路线，分别涉及工作记忆抑制和延迟厌恶。","Barkley 模型把行为抑制作为基础，其困难可牵连非语言工作记忆、语言内化、情绪动机调节和行为重建。","认知–能量模型强调喚醒、活化和努力状态不能与任务需要匹配，因此表现受事件速率和即时反馈影响。","发育双重分离模型区分相对静态的皮质下缺陷与后期动态前额叶代偿。","资料还列气质亚型、工作记忆保留亚群和性别差异，说明相同诊断下的机制及表现并不一致。"],"hint":"双通路 · 抑制 · CEM · 发育双重分离 · 异质性","source":"L5A 第 16–20 页","p":37,"end":37},{"id":"5-short-5","lesson":5,"kind":"short","num":5,"q":"什么是认知灵活性和固执性错误？Lage 元分析提供什么证据？","points":["认知灵活性指随环境变化切换任务、策略并调整行为。维度转换包括学规则、接收变化反馈、抑制旧规则和使用新规则。","固执性错误是已经获得旧规则错误或规则变化的明确反馈，却仍持续用旧规则。","Lage 等（2024）元分析纳入 59 项研究、4,158 人，年龄 4–85 岁，排除 IQ\u003c70 并匹配 IQ。","资料报告小至中度困难并有明显异质性；WCST 较敏感，IED 提前终止可能低估困难。","年龄不是显著调节变量；这是研究间效应的结果，不能据此认定每名个体都不可能随学习改善。"],"hint":"灵活性 · 维度转换 · PE · 59 项 · WCST · 异质性 · 年龄","source":"L5B 第 1–4 页、19","p":37,"end":38},{"id":"5-short-6","lesson":5,"kind":"short","num":6,"q":"怎样用三个理论理解 ASD 对变化的困难，并提出资料中的支持？","points":["单聚焦理论认为注意高度集中于单一目标，可产生深度优势，但突然切换需要很大的资源重分配。","弱中央统合理论关注局部加工偏向：细节任务可有优势，但不容易从局部跳到全局规则。","贝叶斯解释认为感觉输入权重较高、先验较弱，环境容易显得不可预测，追求同一性可减少不确定性。","因此，课件建议提前告知变化、提供视觉日程、每次只改变一个变量，并通过兴趣内容提高参与。","还应考虑焦虑和感官负荷，理解部分重复行为可能具有自我安抚作用。"],"hint":"单聚焦 · 局部加工 · 预测编码 · 不确定性 · 视觉日程 · 兴趣","source":"L5B 第 5–6 页、13、16–17","p":38,"end":38},{"id":"5-short-7","lesson":5,"kind":"short","num":7,"q":"如何用 EEG、P300、瞳孔和眨眼理解认知负荷？","points":["典型负荷增加时 Theta（4–8Hz）增强、Alpha（8–12Hz）受抑，资料称后者为 ERD。","P300 是刺激后约 300 毫秒的正向 ERP 成分，与注意投入和工作记忆更新有关；资料综述中多项ADHD 和读写障碍研究发现波幅较低。","瞳孔反应与 LC–NE、喚醒和心智努力有关，资料用读写困难较大扩张以及 ADHD 先扩后缩作例子。","视觉专注时眨眼减少，严重过载时可能反弹，资料将其联系到基底核和多巴胺。","这些是需要结合任务和其他资料解释的状态指标，不应凭单个指标直接给学生下诊断。"],"hint":"Theta · Alpha · ERD · P300 · LC–NE · 眨眼 · 情境","source":"L5A 第 7 页；L5B 第 7–10 页","p":38,"end":38},{"id":"5-short-8","lesson":5,"kind":"short","num":8,"q":"测量特殊儿童认知负荷时，有哪些效度与伦理问题？","points":["头动可使脑电和眼动失真，需采用适合儿童的固定或眼镜式测量，并处理伪影。","视线偏离中心会使瞳孔形状变化，形成 PFE，需要视角校正。","药物可能改变瞳孔等反应，研究要记录用药状态并在设计或分析中处理混淆。","设备本身可造成感官不适和退出；资料举 105 名 ADHD 中 34 人因 fNIRS 设备不适退出。","因此，应选择舒适轻量设备、提供模拟环境熟悉训练和适当扫描方式，以儿童舒适安全为底线。"],"hint":"头动 · PFE · 药物 · 脱落 · 轻量设备 · 儿童福祉","source":"L5B 第 10 页","p":38,"end":39},{"id":"5-short-9","lesson":5,"kind":"short","num":9,"q":"区分三种认知负荷，并各举一种资料中的课堂支持。","points":["内在负荷与内容复杂度和先验知识有关，可通过分解材料、搭建已有知识与新内容的联系来调节。","外在负荷来自无效呈现和环境干扰，应减少噪声、混乱格式和不必要刺激。","相关负荷是图式建构和理解的有益努力，应把有限资源留给这部分。","读写障碍可用外显音位拼读、短段与多感官支持；ADHD 可用短讲授、身体休息、互动及即时反馈；ASD 可用视觉日程、转换预告和安静角落。","这些是按具体学习需要调整的策略；同一诊断下仍要考虑个体差异。"],"hint":"内在 · 外在 · 相关 · 图式 · 分解 · 个体化","source":"L5B 第 11–17 页","p":39,"end":39},{"id":"5-short-10","lesson":5,"kind":"short","num":10,"q":"跨诊断支持、UDL 和拒绝神经决定论有什么联系？","points":["共病和共享的执行功能、工作记忆困难提示，支持可以围绕实际学习需要组织，而不只按单一诊断分配。","UDL 提供多种表征、多种行动与表达、多种参与，给学生不同的理解、表现和投入途径。","第 5 课将它们分别联系到识别、战略和情感网络；答题时应说明这是该页提出的对应。","异质性意味着不能给所有同诊断学生同一教案；多感官支持也不等于固定视觉型或听觉型学习者。","拒绝神经决定论，是不把当前脑影像当成不可改变的命运。资料强调可塑性、环境调整和教师支持。"],"hint":"共病 · 需求 · UDL 三原则 · 异质性 · 神经决定论 · 可塑性","source":"L5B 第 13 页、17–19","p":39,"end":39},{"id":"6-short-1","lesson":6,"kind":"short","num":1,"q":"什么是 UDL 和 DI？两者如何在一节课中配合？","points":["UDL 是在设计课程时主动减少障碍，提供多元表征、多元行动与表达、多元参与，使学生能以不同路径达成学习目标。","DI 依据学生的准备度、兴趣和学习概况，通过形成性评估调整内容、学习过程与成果。","实际安排可以先用 UDL 提供可访问文本、音频和产出选择，再根据学生的课堂表现，用 DI 增加提示、小组支持或改变任务难度。","两者配合时要保持清楚的学习目标；避免把 DI 做成永久能力分组，也避免把 UDL 做成没有追踪的自由选择。"],"hint":"课前主动 · 课中响应 · 三原则 · 形成性评估","source":"L6A 第 3–8 页；L6B 第 15 页","p":48,"end":49},{"id":"6-short-2","lesson":6,"kind":"short","num":2,"q":"Griful-Freixenet 的综述如何归纳 UDL 与 DI 的关系？","points":["综述纳入 27 项研究，其中 8 项实证研究、19 项理论研究，归纳互补、嵌入和不相容三种关系。","互补占 37%，强调 UDL 处理课前的共同课程障碍，DI 在教学中响应个体差异。","嵌入占 48%，是比例最高的观点，把 UDL 视为外层框架，把 DI 视为内部实践。","不相容占 15%，关注 DI 固定分组可能固化标签，以及 UDL 选择过多可能缺少能力基线和进度追踪。","这些比例是文献观点分布，不能据此断言某种关系的教学效果最好。"],"hint":"27 项 · 37% · 48% · 15% · 三种关系","source":"L6A 第 5–7 页","p":49,"end":49},{"id":"6-short-3","lesson":6,"kind":"short","num":3,"q":"Boysen 等如何检验 UDL 的脑科学依据？研究批评了什么，又没有直接否定什么？","points":["研究审查 UDL 三原则与三个神经网络及特定脑区一一对应的说法，将 1,909 条记录去重为 1,442条引文，检查 36 个指南检查点。","资料报告只有 16 篇相关神经科学引文，约 1%；27 个检查点没有此类引文，而且文献往往呈现分布式活动，未充分支持精确脑区对应。","支持程度被分为直接 5%、间接 74%、无支持或无关 21%；另一次检索得到 40 篇独立文献，没有发现直接验证 UDL 神经机制的一手实证研究。","结论是不能用脑术语、脑图或间接脑区活动代替教学证据；神经科学依据不足，也不自动等于所有 UDL 课堂做法都无效。","评价具体做法仍要明确操作、比较教学结果，并检查认知、行为和课堂研究证据。"],"hint":"三网络对应 · 引文审查 · 约 1% · 直接与间接 · 教学成效","source":"L6A 第 9–14 页","p":49,"end":49},{"id":"6-short-4","lesson":6,"kind":"short","num":4,"q":"Astle 为什么主张跨诊断理解神经发展与学习困难？","points":["传统诊断分类存在阈值问题、类别内部高度异质和类别之间大量重叠，因此一个标签难以完整描述儿童的学习能力。","只研究排除共病的纯诊断组，会低估真实课堂中交叠的困难，影响研究的生态适用性。","跨诊断研究改从实际功能困难、连续的认知维度和一般人群差异出发，关注语音、执行功能、速度及社交沟通等需要。","不同诊断的儿童可以共享同一弱项，同一诊断的儿童也可能需要不同支持。","教育上应建立个体认知与学习画像，按需要提供分层支持，并避免诊断遮蔽和只有取得诊断才能获得帮助的门槛。"],"hint":"异质性 · 重叠 · 功能维度 · 个体画像 · 按需支持","source":"L6A 第 15–20 页","p":49,"end":50},{"id":"6-short-5","lesson":6,"kind":"short","num":5,"q":"CALM 及脑网络、遗传研究如何支持跨诊断视角？","points":["CALM 纳入约 800 名有实际学习困难的儿童，只有约三分之一有 ADHD 诊断，体现按功能困难而非单一标签取样。","资料概括三个认知因素：语音加工主要预测阅读，执行功能主要预测数学，加工速度关联更广泛学业表现。","其他聚类研究中的 10 个分组仍混合不同诊断；全脑白质网络指标也比只看单一脑区更能说明学习差异。","多基因小效应、一因多效和跨诊断 PRS 关联说明遗传风险不一定服从诊断边界；不同 CNV 起点也可能汇聚到共享网络。","等终性表示不同原因可产生相似功能结果，因此需要从儿童当前的能力结构出发安排支持。"],"hint":"CALM · 三个因素 · 网络 · PRS · 等终性","source":"L6A 第 16–20 页","p":50,"end":50},{"id":"6-short-6","lesson":6,"kind":"short","num":6,"q":"Lotfi 的自适应 VSWM 训练如何设计？行为结果说明什么？","points":["资料采用准实验，35 名 7–12 岁严重阅读困难儿童分为训练组 15 人、等候对照组 20 人，在训练前、训练后和 6 个月评估。","BrainWare Safari 包含 6 种视觉空间工作记忆游戏；难度从 1 个记忆项逐步升至 6 个，成功才升级，以最近发展区维持合适挑战。","训练后注意力、反应控制与 1-back 任务表现改善；即时阅读增幅虽训练组较高，但资料报告当时未达显著。","6 个月追踪时阅读理解及综合阅读出现改善，资料将其解释为延迟迁移，提示要让训练效果有机会在真实阅读中继续应用。","训练剂量原文同时写 5 周、每周 5 天和 30 次，存在日程口径问题；回答时应保留资料说法，避免自行补出不存在的训练安排。"],"hint":"准实验 · 自适应 · ZPD · 即时与延迟 · 6 个月","source":"L6B 第 2–4 页","p":50,"end":50},{"id":"6-short-7","lesson":6,"kind":"short","num":7,"q":"Lotfi 研究中的 P3b 怎样测量和解释？回答时需要保留什么限制？","points":["研究在 Pz 位置分析正确试次中 250–500 ms 的 P3b，资料用波幅讨论注意资源动员与工作记忆更新，用潜伏期讨论处理速度。","训练组波幅由 4.90 增至 7.43 μV，对照组由 4.97 至 3.76 μV；潜伏期约 370–390 ms，未见明显变化。","资料把这一模式解释为资源容量增加而非处理速度加快，并提出基础加工省力可能为阅读理解释放资源。","但同页 ANCOVA 写 p=.051，和“显著”“增加 35%”的文字口径不完全一致；P3b 变化与WMTB-C 变化的相关也写 p=.07。","因此复述作者解释时应明确“资料据此解释”，并把相关、神经指标变化和长期学业成效区分开，不把解释链写成每一步均已证实。"],"hint":"Pz · 250–500 ms · 波幅 · 潜伏期 · 解释与证据","source":"L6B 第 4–7 页","p":50,"end":51},{"id":"6-short-8","lesson":6,"kind":"short","num":8,"q":"Rusconi 教师培训如何把 PIT 四维度变成可测量的结果？","points":["PIT 的四维度为重视学习者多样性、支持所有学习者、与他人协同合作、个人专业持续成长。","研究分别用 SCCI 测教师思维，用 TSR 测教案及课堂可及性，用协同教学日志测合作模式，用SAED 测全纳教学自我效能。","培训总计 20 小时，包括 16 小时线下和 4 小时线上，结合全纳理念、神经科学内容、UDL 教案设计与微格演练。","瑞士提契诺州 51 名教师参与准实验，其中培训组 20 人、对照组 31 人，并安排 3 个月追踪。","这种设计既检查教师怎么看学生，也检查教师如何设计、如何授课、如何协作以及是否有实施信心。"],"hint":"PIT · SCCI · TSR · 日志 · SAED · 20 小时","source":"L6B 第 7–9 页","p":51,"end":51},{"id":"6-short-9","lesson":6,"kind":"short","num":9,"q":"教师培训后出现哪些变化？为什么仍需后续支持？","points":["资料报告培训组成长型思维改善，并在 3 个月追踪时维持；教案 TSR 均分由 2.35 升至 3.28，课堂视频评分由 2.23 升至 3.28。","协同教学中，一教一辅的比例下降，平行教学和站点教学增加，特教教师更接近共同授课的伙伴。","自我效能在培训后提高，但 3 个月后总分由 7.05 回落至 6.84，资料呈现 p=.087 的回落趋势，不能把该数字写成显著下降。","资料用 Bandura 的掌握经验、替代经验、言语劝说、生理及情绪状态解释自我效能来源。","因此一次培训之外，还需要持续导师支持、同伴反思与共同实践，帮助教师在真实班级压力下维持实施信心。"],"hint":"思维 · 可及性 · 平行／站点 · 自我效能 · Bandura · 持续支持","source":"L6B 第 9–13 页","p":51,"end":51},{"id":"6-short-10","lesson":6,"kind":"short","num":10,"q":"请依据本课，为同时有阅读和注意困难的叙事课学生设计支持。","points":["先用 UDL 减少共同障碍，提供清晰文本、音频和重点标示，允许学生通过写作、故事图或口述展示同一核心学习目标。","再用形成性检查识别谁需要额外支架，以 DI 安排小组、模板、步骤提示或更细的任务拆分，避免永久能力分组。","支架按完整提示、逐渐撤除、开放独立任务推进；将高负荷学习分段，并安排短休息。","环境上减少视觉杂乱和噪声，提供可预测日程；合作上采用平行或站点教学，让两名教师共同承担教学。","最后通过课堂作品与学习表现评估是否有效，检查相关与因果、学习风格迷思以及学业证据，不因方法带脑科学名称就认定有效。"],"hint":"UDL · DI · 支架渐退 · 环境 · 协同教学 · 证据检查","source":"L6B 第 14–18 页","p":52,"end":52},{"id":"7-short-1","lesson":7,"kind":"short","num":1,"q":"NIES 包含哪四个步骤？请用可塑性说明怎样落到课堂。","points":["NIES 依次为辨识神经原理、界定大脑功能属性、建立教学导向、发展课堂策略。","以可塑性为例，原则是经验与学习能够改变神经连接；功能属性包括练习、已有知识、巩固与睡眠对连接变化的影响。","教学取向据此采用分散而主动的学习、接近最近发展区的挑战与适当休息。","具体策略可以包括间隔练习、提取练习、交错练习和结构化微休息，例如输入后安排低压力回忆，再作短时活动。","NIES 强调同时检查神经解释是否合理和教育结果是否改善；学习改善是预期结果，不是第五个转译步骤。"],"hint":"原则→属性→取向→策略 · 可塑性 · 双重问责","source":"L7A 第 3–7 页","p":62,"end":62},{"id":"7-short-2","lesson":7,"kind":"short","num":2,"q":"根据资料，计算障碍为什么可能表现为数感、算术事实和应用题多方面困难？","points":["IPS 参与数量表征，资料把右侧与非符号点阵或实物多少联系，把左侧与数字和运算符号加工联系。","左 AG 参与熟练算术事实提取；提取困难时，儿童可能依赖 IPS 支持的逐一计数，增加处理负担。","应用题还需语言网络与数量网络合作：Wernicke 相关功能帮助理解语义和情境，Broca 相关功能帮助维持语言信息及组织步骤。","执行功能、视觉空间工作记忆、阅读困难和第二语言负担也可能同时影响数学表现。","因此教学要分析具体困难，选择数量操作、词汇与阅读支架、视觉表征及策略指导，不能把所有数学困难只归为不努力或只要求反复背答案。"],"hint":"IPS · 左 AG · Wernicke · Broca · 共病 · 双重支架","source":"L7A 第 8–13 页","p":62,"end":62},{"id":"7-short-3","lesson":7,"kind":"short","num":3,"q":"学校心理学家在教育神经科学转译中承担什么角色？","points":["脑研究主要描述机制，课堂教学还涉及价值目标、发展、社会环境和长期结果，不能把实验结果直接变成普遍教学命令。","学校心理学家需要同时理解研究语言与课堂语言，把证据转成教师和家长能理解的支持方案，并依据评估数据参与 RTI 和 IEP 决策。","他们也承担证据把关，检查商业脑训练和神经迷思是否有实际学习证据。","转译应是双向的：把研究带进课堂，也把课堂中真实的困难、实施条件和效果反馈给研究者。","资料提出研究学校，让教师在专业合作下提出并检验真实教学问题，而非仅被动执行外部研究方案。"],"hint":"描述与规范 · 双语桥梁 · 数据决策 · 把关 · 双向转译 · 研究学校","source":"L7A 第 15–20 页","p":63,"end":63},{"id":"7-short-4","lesson":7,"kind":"short","num":4,"q":"RTI 三个层次怎样区分？怎样与 IEP 连接？","points":["Tier 1 为全员普及预防，资料图示 80%–85%，以高品质核心课程与通用筛查提供基础支持，通常每年评估 2–3 次。","Tier 2 为小组目标补充，图示 10%–15%，针对持续困难提供小组支架，通常每周评估；资料示例为每周 3–4 次针对性支持。","Tier 3 为个别化密集干预，图示 5%，提供高强度、个别化 IEP，评估频率为每日至每周。","进入更高层次表示支持需要增加，不是把学生永久固定在一个能力等级。","IEP 要写清可观察目标、条件和达标标准，例如使用 Cuisenaire 彩色数棒完成 10 以内数字分解，达成率 85%。"],"hint":"Tier 1／2／3 · 支持强度 · 评估频率 · IEP · 85%","source":"L7A 第 18–19 页","p":63,"end":63},{"id":"7-short-5","lesson":7,"kind":"short","num":5,"q":"DA、CRA 和 DSM 有什么区别？如何配合帮助数学困难学生？","points":["DA 动态评估用测验—教学—再测验，比较独立表现与支架后的表现，寻找有效帮助和学习潜能。","CRA 提供具体操作、图像表征、抽象符号的学习路径，让学生逐步理解数学概念。","DSM 动态策略数学整合词汇、阅读、算术策略、元认知和任务分块，帮助文化与语言多样背景的学生理解并说明解题过程。","三者可配合使用：先通过 DA 找到学生在哪种帮助下进步，再用 CRA 安排概念学习，并通过DSM 示范、共同解决和逐渐独立完成策略性解题。","本课 DSM 是 Dynamic Strategic Math，不是临床诊断分类手册的同名缩写。"],"hint":"DA 评估 · CRA 表征路径 · DSM 策略教学 · 渐进支架","source":"L7B 第 1–6 页","p":63,"end":63},{"id":"7-short-6","lesson":7,"kind":"short","num":6,"q":"请说明 Garcia 的分数课怎样落实文化响应、语言支架和渐进释放责任。","points":["Garcia 给 3–5 名有英语学习及数学困难需要的学生安排小组，用熟悉的 quesadilla 建立文化与生活经验连接。","先教 whole、half、quarter、numerator、denominator 等词，结合齐读、画图和具体分割，减少第二语言理解负荷。","题目将整体分为 8 份，吃掉 3 份、给人 2 份，依次明确求剩余、确认八等份、标出 3 份及 2 份，再得到剩余 3/8。","教学责任由教师示范“我做”，过渡到“我们做”“你们一起做”，最后“你独立做”。","学生需要把步骤说出来，教师据此检查理解、提供反馈，并逐渐撤去支架。"],"hint":"文化熟悉材料 · 语言支架 · 3/8 · I do→We do→You do together→You do alone","source":"L7B 第 3–6 页","p":64,"end":64},{"id":"7-short-7","lesson":7,"kind":"short","num":7,"q":"怎样把计算困难画像转成具体 IEP 支持？请举三类例子。","points":["若主要困难是数感，资料建议每日约 5 分钟点阵比较和 Cuisenaire 彩色数棒等具体操作，帮助建立数量表征。","若主要困难是算术事实提取，可使用提取表与计算器支架，减轻每次从头计数的负担。","若主要困难是视觉空间工作记忆和任务负荷，可用大方格纸、减少页面题量、分块和避免高压限时。","IEP 目标应包含任务、支持条件和可检验标准，例如在数棒支持下完成 10 以内分解并达到 85%。","这些支持基于课堂功能画像与评估，不应把一个学习错误直接解释为已确诊的某脑区损伤。"],"hint":"数感 · 提取 · VSWM · 可观察目标 · 达标标准","source":"L7A 第 19 页；L7B 第 6 页","p":64,"end":64},{"id":"7-short-8","lesson":7,"kind":"short","num":8,"q":"怎样用本课的脑科学语言与家长沟通，同时保持具体可做？","points":["沟通可分内容层面和设计层面：既解释可塑性与发展，也共同调整任务、支持和反馈。","“25 年建筑工地”是帮助理解长期发展的隐喻；“舒适—成长—压力”三区用于讨论需求和资源是否匹配，目标是有支持的 ZPD 成长区。","按自我决定理论，要用小成功建立胜任感，用 2–3 种有意义选择支持自治感，用稳定师生与同伴关系建立关联感。","家校应把讨论落到孩子目前卡在哪一项、给什么帮助、怎样看进步，减少固定能力和责备性标签。","隐喻不能替代个别评估，也不能把 25 岁说成所有人大脑统一完成发育的绝对界线。"],"hint":"内容与设计 · 建筑工地 · ZPD · SDT 三需要 · 具体支持","source":"L7B 第 7–11 页、13","p":64,"end":64},{"id":"7-short-9","lesson":7,"kind":"short","num":9,"q":"什么是资料中的创伤知情课堂？评价和教师互动可以怎样配合？","points":["资料将长期压力与 HPA 轴、皮质醇及学习功能联系，强调先建立安全感和可预测性。","四项基本支持是照顾营养饮水和睡眠、建立稳定日程、提供平静退避空间、保持积极接纳的互动。","教师可通过目光、语气、微笑、适当幽默和开放姿态减少心理距离，即提高亲近性 immediacy。","评价应关注过程和个人成长，安排低压力、多次尝试及允许纠错的机会，提供可执行的下一步反馈。","目标是降低学习障碍、支持参与；不能凭课堂表现给学生下创伤或脑功能诊断。"],"hint":"HPA 轴 · 安全 · 可预测 · 四项支持 · immediacy · 过程评价","source":"L7B 第 11–13 页","p":65,"end":65},{"id":"7-short-10","lesson":7,"kind":"short","num":10,"q":"Thomas 调查对教育神经科学转译提出什么要求？如何理解 RCT、专业判断和转译枢纽？","points":["调查包含 1,006 名教师；工作负担 42%、经费 19%、行为与情绪问题 13%，说明转译必须回应真实困难并避免增加负担。","约 33%听说过教育神经科学，知晓者中 76%认为有帮助；60%需要实践指南，更偏好 CPD 和工作坊，说明仅讲理论不足。","资料引用 141 项 RCT 平均效应量.06 及 35%零或负效应，提醒效果会受课堂情境影响；这不等于放弃试验，也不能直接与另一整体干预的 1.58 作优劣判断。","科学应成为反思工具，帮助教师解释对谁、在何种条件下有效，而不是机械的标准指令。","转译枢纽应连接大学实验室、特殊教育课堂、学校心理评估团队、政策部门及家长，让研究、实施与反馈形成持续合作。"],"hint":"1006 名 · 减负 · 实践指南 · 情境 · 反思工具 · 转译枢纽","source":"L7B 第 14–18 页","p":65,"end":65},{"id":"8-short-1","lesson":8,"kind":"short","num":1,"q":"什么是 AT？如何用 SETT 为学生选择工具？","points":["AT 是用于增加、维持或改善障碍者功能能力的设备或产品系统，既包括低技术，也包括高技术。","用 SETT 依次分析学生的功能、语言和文化需要，实际使用环境，必须完成的任务，最后才选择工具。","在四个维度加入文化回应，考虑家庭价值、母语支持、资源及污名化风险。","让学生、家庭及专业人员参与讨论、审查、探索与调整，检验工具能否持续支持平等参与。"],"hint":"AT 定义 · Student · Environments · Tasks · Tools · 文化回应","source":"L8A 第 2 页、5–7","p":77,"end":77},{"id":"8-short-2","lesson":8,"kind":"short","num":2,"q":"列出五类教育神经技术，并说明课堂应用为什么仍需审慎评估。","points":["五类为大脑结构与功能测量、神经反馈、非侵入物理神经调控、BCI 和 AI 赋能神经技术。","Nouri 综述纳入 471 项研究，但纵向研究只有 21 项、质性研究只有 1 项，长期发展和使用者经验不足。","研究偏重认知、高等教育和典型发展群体，真实全纳课堂及部分特殊群体覆盖不足。","因此评价应同时考察科学有效性、教育相关性及实验室结果的课堂生态效度。"],"hint":"五类 · 471 · 21 · 1 · 科学有效性 · 教育相关性","source":"L8A 第 8–13 页","p":77,"end":77},{"id":"8-short-3","lesson":8,"kind":"short","num":3,"q":"区分主动 BCI 和被动 BCI，并各举一个教育例子。","points":["主动 BCI 要求学习者有意识诱发特定神经活动，如运动想象或注视目标字母，转换为外部控制指令。","教育例子是 P300 拼写器帮助无法用常规动作作答的学生输入文字。","被动 BCI 在自然任务中隐式读取认知或情绪状态，不要求学生额外发指令。","教育例子是根据 EEG 认知负荷指标调整课件节奏、简化材料或增加支持。"],"hint":"有意识控制 · 隐式监测 · P300 · 自适应","source":"L8A 第 15–17 页","p":77,"end":77},{"id":"8-short-4","lesson":8,"kind":"short","num":4,"q":"BCI 从实验室进入全纳课堂，主要面临哪些问题？","points":["神经信号随疲劳、注意及电极状态变化而漂移，反复校准会占用课堂时间。","硬件、维护和采购政策造成成本与可及性限制，资料提到一次电极调校可能耗时 15–30 分钟。","TPACK 分布显示技术研究充分，但教学法及学科内容整合不足，需对准课程目标。","还须保障隐私、知情同意和自主权，并让教师、学生、家庭及工程人员共同设计舒适、易用的系统。"],"hint":"信号漂移 · 成本 · TPACK · 伦理 · 共同设计","source":"L8A 第 16 页、18–20","p":77,"end":77},{"id":"8-short-5","lesson":8,"kind":"short","num":5,"q":"说明 tDCS 的机制、主要综述结果及证据边界。","points":["tDCS 通过低强度恒定电流调节皮层静息膜电位，不直接引发动作电位；资料一般表述为阳极促进兴奋、阴极降低兴奋，但儿童效应可有非线性和反转。","资料所引系统评价包括 35 项 RCT 及 745 名儿童青少年，涉及 ADHD、ASD、读写障碍。","18 项多疗程研究报告 88.8%的改善率，累计 6,587 次刺激未报告严重不良事件；这些数字只描述纳入研究。","限制包括样本小、双盲不足、电场建模不足、伴随训练干扰及缺少真实课堂长期验证。"],"hint":"膜电位 · 35 项 RCT · 745 · 6,587 · 研究限制","source":"L8B 第 1–3 页、9–10","p":78,"end":78},{"id":"8-short-6","lesson":8,"kind":"short","num":6,"q":"按资料区分 ADHD 的冷、热执行功能，并说明为什么不能给 tDCS 统一疗效结论。","points":["冷执行功能与前额叶—纹状体回路相关，涉及工作记忆、反应抑制及认知灵活性。","热执行功能与腹侧纹状体—vmPFC 奖励回路相关，涉及延迟折扣、奖励与风险决策。","资料中 dlPFC、rIFG 和 vmPFC 针对的功能不同，同样是 ADHD 研究也不能直接互换。","结果还受剂量、方案、亚型及伴随训练影响；例如 rIFG 加训练有未优于单纯训练的结果，也有不同剂量效果方向不同的报告。"],"hint":"冷 EF · 热 EF · 回路 · 靶点 · 异质性","source":"L8B 第 3–5 页、9","p":78,"end":78},{"id":"8-short-7","lesson":8,"kind":"short","num":7,"q":"什么是状态依赖性？为什么儿童 tDCS 不能照搬成人参数？","points":["状态依赖性指神经调控效应受施加时大脑正在进行的认知活动影响，因此资料主张把调控与相应的循证教学或训练结合。","儿童颅骨、头皮及 CSF 比例不同，会改变同一外加电流在脑内的分布。","资料报告儿童阴极效应可能反转，说明效果并非固定的线性关系。","研究和转化应考虑个体电场建模、剂量差异、睡眠节律、障碍亚型与课堂生态条件；课件中的剂量是研究条件，不是个人实施建议。"],"hint":"状态依赖性 · 儿童解剖 · 反转 · 个体化 · 生态效度","source":"L8B 第 8–10 页","p":78,"end":78},{"id":"8-short-8","lesson":8,"kind":"short","num":8,"q":"怎样构建 AI/VR 支持的自适应全纳系统？","points":["利用 VR/AR 提供可控、可重复的练习场景，并利用 AI 进行个性化调整，LLM 辅助对话与易读材料。","感知层收集眼动、HRV 及点击流等线索；决策层判断任务与 ZPD 的匹配及过载、无聊等状态；反馈层调整环境、步骤和挑战。","从设计之初落实全纳与无障碍，关注教师福祉、虚拟人同理心及跨领域协作。","教师必须在回路中审核内容和作专业判断，同时处理成本、眩晕、算法偏见、师资准备及现实社交脱节等限制。"],"hint":"VR · 三层闭环 · ZPD · Inclusion by Design · Human-in-the-Loop","source":"L8B 第 10–14 页","p":78,"end":79},{"id":"8-short-9","lesson":8,"kind":"short","num":9,"q":"列出五项神经权利，并说明学校应怎样保护神经数据。","points":["五项神经权利是精神隐私权、精神完整权、心理自主权、公平增强权和反算法偏见权。","神经数据应实行去标识化、全流程加密、本地或边缘存储/运算、限制第三方商业传输，并明确保存上限和删除周期。","防止根据不成熟的神经分类给学生贴上永久能力标签。","不得强制通过脑电排行榜奖惩学生，技术使用应服务其自主性与平等参与。"],"hint":"五项权利 · 加密 · 本地化 · 删除 · 反标签化","source":"L8A 第 19 页；L8B 第 16–17 页","p":79,"end":79},{"id":"8-short-10","lesson":8,"kind":"short","num":10,"q":"对未成年或无语言能力学生，怎样落实知情同意和公平可及？","points":["通过图形、视频和社交故事解释设备功能、风险及数据范围，提高学生理解和表达意愿的机会。","监护人授权后仍须观察学生的持续同意；持续抓挠、烦躁啼哭等拒绝信号应受到尊重，学生可以随时撤回。","降低设备成本并改进公共采购，优先支持资源不足学校，防止形成神经鸿沟。","把 AT 视为基本教育公共产品，并通过家庭、教师、学生和技术人员共同设计提高适用性。"],"hint":"动态同意 · 随时撤回 · 神经鸿沟 · 公共产品","source":"L8B 第 17–18 页；L8A 第 20 页","p":79,"end":79},{"id":"9-short-1","lesson":9,"kind":"short","num":1,"q":"区分 CLT 三种认知负荷，并解释为什么“减负”不等于降低学科难度。","points":["内在负荷由材料本身的元素交互复杂度决定；外在负荷来自无关信息与不良呈现；相关或有效负荷是图式构建和深度理解所需的投入。","课程设计要极小化外在负荷，并最适化有效负荷，让有限工作记忆用于理解。","可通过组块化、相关图文对齐、删去无关动画与冗余文字来减少无效消耗。","Santioso 资料中的实验组外在负荷降低，但内在负荷与对照组无显著差异，说明呈现优化与核心内容难度是不同层面。"],"hint":"三负荷 · 工作记忆 · 极小化 · 最适化 · 内在不变","source":"L9A 第 5–8 页","p":92,"end":92},{"id":"9-short-2","lesson":9,"kind":"short","num":2,"q":"怎样根据资料设计情绪安全、能维持动机的课堂？","points":["营造低情绪威胁、高智力挑战的环境，避免羞辱、惩罚性排名和不可预测压力，允许把错误作为调整线索。","将大任务拆成可达成的微挑战，并给及时、具体的形成性反馈；资料用正向奖励预测误差解释其动机作用。","用与学习目标直接相关的故事和真实问题提高情绪显著性，避免无关煽情或装饰。","依据 CATLM 保持适度唤醒，兼顾兴趣与负荷；情绪设计对概念迁移的作用不能直接等同于事实回忆的改善。"],"hint":"低威胁高挑战 · RPE · 微挑战 · 情绪显著性 · CATLM","source":"L9A 第 9–13 页","p":92,"end":92},{"id":"9-short-3","lesson":9,"kind":"short","num":3,"q":"按 L9A p.14 主表，列出 CEN-STEM 的四组核心原则，并指出资料编号问题。","points":["教育者知识组包括应对神经神话、元认知与执行功能。","情绪动机组包括奖励与动机、情绪安全、情绪参与。","神经适应组的主要内容包括神经可塑性与针对性学习、认知负荷管理、大型神经网络相互作用。","积极实践组包括积极参与、多重感官与科技增强学习。","p.14 另重复印一处 P7“大型参与”，p.15 展开页又交换了故事与奖励的 P3/P5 对应，故应按题目指定页源作答，不自行合并编号。"],"hint":"四组 · 十项主要内容 · 按页作答 · 编号差异","source":"L9A 第 14–16 页","p":92,"end":92},{"id":"9-short-4","lesson":9,"kind":"short","num":4,"q":"说明 CIRCLE 的五层如何支持全纳课程。","points":["基础层以证据审查课程与工具，排除未经验证的商业神经神话。","社会情感层建立归属感、清晰合作规则和可达成的成功体验。","认知层通过组块化、负荷管理及 TPN 专注与 DMN 反思交替，配合学习加工需要。","教学层借助实物、虚拟模拟和生活比喻帮助学生理解抽象学科内容。","最外层的技能发展体现认知弹性、自适应问题解决与全纳同伴协作等教育成果。"],"hint":"基础 · 社会情感 · 认知 · 教学 · 技能","source":"L9A 第 17–19 页","p":92,"end":93},{"id":"9-short-5","lesson":9,"kind":"short","num":5,"q":"为什么提取练习要具有“必要难度”？怎样实施？","points":["提取练习要求学习者主动重建知识，而非只在答案出现时感到熟悉；资料称被动重读容易产生流畅性错觉。","必要难度要求任务适度费力且可克服，能促使学生努力回想，但必须保留足够先备知识和支架。","可在每课安排 2–3 次低风险、无分数惩罚的微检索，如默画脑图或快问快答。","将提取分布在不同时间，并根据错误给具体反馈、安排修订和后续检索；不能用无支架的过难任务代替必要难度。"],"hint":"主动重建 · 流畅性错觉 · 适度费力 · 低风险 · 间隔","source":"L9B 第 1–4 页；L9A 第 20 页","p":93,"end":93},{"id":"9-short-6","lesson":9,"kind":"short","num":6,"q":"完整写出自适应六步循环，并说明它与固定分班的区别。","points":["第一步动态诊断，收集前测、反应时间与先验知识；第二步教学适配，调整难度与支架密度。","第三步主动加工，安排深度推理与具身探究；第四步分布提取，在跨天跨周的时间中重复检索。","第五步形成反馈，针对思路漏洞给具体指引；第六步监控校准，结合学习日志和教师观察决定下一轮支持。","快速进阶、中度支架和持续支持是根据任务表现变化的路径，而非永久的快慢班标签；资料比例34%、46%、20%。","算法不能替代教师判断，线上个体化练习与线下复杂互动应按功能协同。"],"hint":"诊断 · 适配 · 加工 · 提取 · 反馈 · 校准 · 动态路径","source":"L9B 第 3–5 页","p":93,"end":93},{"id":"9-short-7","lesson":9,"kind":"short","num":7,"q":"说明 UDL 的三原则与三网络映射，并各举一例。","points":["识别网络对应 What 及多重表征，例如同时提供图片、音频和具体材料帮助学生理解。","策略网络对应 How 及多重表达，例如允许通过口述、手偶、画图或搭建展示同一学习目标。","情感网络对应 Why 及多重参与，例如提供选择权、生活问题和同伴合作维持动机。","UDL 从课程设计之初考虑多元需要，目标是实质认知参与和进步，而非仅将特殊学生放入普通教室。"],"hint":"识别—What—表征 · 策略—How—表达 · 情感—Why—参与 · 设计之初","source":"L9B 第 5–6 页","p":93,"end":93},{"id":"9-short-8","lesson":9,"kind":"short","num":8,"q":"概述 Jhuo & Chu 研究的三轮改进，说明行动研究如何发挥作用。","points":["研究在 30 名 4–6 岁幼儿、含 5 名发展迟缓幼儿的全纳班进行，普特教师跨一学年进行计划、行动、观察、反思的三轮循环。","第一轮撤隔离柜，共享多感官教具并开放不同作答方式；幼儿开始参与，但持续独立性仍不足。","第二轮加入点读笔、斑马贴纸和自评检核表，使指令可重复获取、进度可见；根据观察将过多文字改成图标。","第三轮加入模拟面包店、立体黏土手偶和同伴扮演，将抽象内容放入可操作的真实情境。","每一轮都依据具体困难修订，而不是认为买了工具就完成全纳。"],"hint":"Plan—Act—Observe—Reflect · 三轮 · 点读笔 · 检核表 · 具身情境","source":"L9B 第 6–10 页","p":94,"end":94},{"id":"9-short-9","lesson":9,"kind":"short","num":9,"q":"以数学课为例，说明怎样将脑友善原则和 UDL 变成教案。","points":["确定数量、货币或简单运算的共同目标，并根据起点设置不同层次任务。","用 CPA 顺序先操作面包与硬币，再用图章或点阵表示，最后连接数字算式。","让学生轮流当顾客与收银员，以生活情境和同伴协作维持参与，必要时用点读笔提供可重复规则。","允许数数、盖章、摆实物或口述等方式展示理解，并用笑脸检核或即时具体反馈帮助自评。","根据课堂观察调整材料、步骤与帮助程度，而非要求所有学生以同一速度、同一书写方式完成。"],"hint":"共同目标 · CPA · 面包店 · 多表达 · 反馈 · 动态调整","source":"L9B 第 9 页、13–15","p":94,"end":94},{"id":"9-short-10","lesson":9,"kind":"short","num":10,"q":"普特协同的五个支柱是什么？学校怎样支持其落地？","points":["五个支柱是平等互信、共同价值、合理分担工作量、基于数据的双周研讨、共同反思迭代。","普通教师与特教人员分别贡献学科/班级视角与改编/无障碍专长，并共同负责课程。","学校应提供共同备课和研讨时间，支持适用材料采购、低成本改装及课堂环境降噪减杂。","文化适配可以结合全班秩序与灵活区角，用当地熟悉的生活情境，避免机械照搬。","教师还需发展识伪批判、机制理解与教案重构三层能力。"],"hint":"互信 · 价值 · 分工 · 双周 · 迭代 · 文化适配","source":"L9B 第 15–17 页","p":94,"end":94},{"id":"4-mc-1","lesson":4,"kind":"mc","num":1,"q":"按资料，“基因多效性”指什么？","opts":["一个基因只对应一个诊断","一个基因可影响多种表型","所有相关状况都由一个基因导致","多基因表示基因之间互不相关"],"ans":1,"a":"多效性讲一个基因的多种影响；多基因讲许多基因共同参与，不能混淆。","p":95,"ep":106,"source":"L4 第 3–4 页"},{"id":"4-mc-2","lesson":4,"kind":"mc","num":2,"q":"哪条通路在资料中被列为 mTOR 的上游？","opts":["Wnt/β-catenin","C1q/C3","PI3K-AKT","NRXN1"],"ans":2,"a":"PI3K-AKT 位于 mTOR 上游；C1q/C3 是免疫相关成分，NRXN1 是基因例子。","p":95,"ep":106,"source":"L4 第 5–7 页"},{"id":"4-mc-3","lesson":4,"kind":"mc","num":3,"q":"资料将 DAN 与 VAN 之间切换灵活性下降，主要配到哪一领域？","opts":["注意调节","皮层分层","突触蛋白合成","海马神经发生"],"ans":0,"a":"DAN 和 VAN 是背侧与腹侧注意网络，资料将它们的切换与注意调节配对。","p":95,"ep":106,"source":"L4 第 11 页"},{"id":"4-mc-4","lesson":4,"kind":"mc","num":4,"q":"仅按课件的 Z 分层表，Z=1.5 属于哪一组？","opts":["低偏差组","高度偏差组","不属于任何已写明的区间","中度偏差组"],"ans":3,"a":"1\u003c1.5\u003c2，所以属于中度偏差。资料没定义等于边界的情况，但本题不在边界。","p":95,"ep":106,"source":"L4 第 12 页"},{"id":"4-mc-5","lesson":4,"kind":"mc","num":5,"q":"若测试集信息混入模型训练，资料建议重点防范什么问题？","opts":["成人神经发生","数据泄露导致模型表现被夸大","认知储备过高","神经指纹消失"],"ans":1,"a":"这是数据泄露；资料强调严格交叉验证。","p":95,"ep":106,"source":"L4 第 14 页"},{"id":"4-mc-6","lesson":4,"kind":"mc","num":6,"q":"以下哪一项最符合结构可塑性？","opts":["教师改变反馈语气","临时切换作答规则","训练后树突生长和新突触形成","通过量表记录兴趣"],"ans":2,"a":"树突与突触是结构。作答规则变化是行为层面，不能单凭它认定结构已经变化。","p":96,"ep":107,"source":"L4 第 17–18 页"},{"id":"4-mc-7","lesson":4,"kind":"mc","num":7,"q":"按资料的倒 U 型解释，哪一说法正确？","opts":["适中的挑战有利，负荷过低或过高均有问题","负荷越高，可塑性一定越强","负荷越低，长期学习一定越好","所有学生最优负荷相同"],"ans":0,"a":"资料同时强调适度挑战和个体差异，不能把负荷越高等同于效果越好。","p":96,"ep":107,"source":"L4 第 20 页、26"},{"id":"4-mc-8","lesson":4,"kind":"mc","num":8,"q":"哪种复习做法对应 Testing Effect？","opts":["只把材料重复读顺","只调大字体","不间断看同类答案","合上材料，尝试回答问题再核对"],"ans":3,"a":"Testing Effect 对应主动回忆和提取练习；反复看答案不等于能自行提取。","p":96,"ep":107,"source":"L4 第 21 页"},{"id":"4-mc-9","lesson":4,"kind":"mc","num":9,"q":"资料中 tDCS 真刺激组“激活更低但表现更好”，主要被解释为什么？","opts":["工作记忆任务已不存在","神经效率提高","所有脑区都停止工作","高激活必然代表学习成功"],"ans":1,"a":"解释同时依据更低激活和更好表现；单看脑激活不能推出效率。","p":96,"ep":107,"source":"L4 第 28–30 页"},{"id":"4-mc-10","lesson":4,"kind":"mc","num":10,"q":"哪组工具特点与资料一致？","opts":["EEG 通过血氧间接测活动，时间分辨率为秒级","tDCS 主要用于记录 ERP","fMRI 测 BOLD，EEG 记录电活动且有毫秒级时间分辨率","DTI 专门测量儿童课堂动机"],"ans":2,"a":"BOLD 属于 fMRI；EEG 记录电活动。tDCS 是调控，DTI 观察白质微结构。","p":96,"ep":107,"source":"L4 第 21 页、32–33"},{"id":"5-mc-1","lesson":5,"kind":"mc","num":1,"q":"RDoC 分层配对在 Tamon 研究中的主要作用是什么？","opts":["让两组只做完全不同的任务","用诊断名称代替实验数据","控制认知任务分布不平衡带来的比较偏差","假定所有诊断的脑机制相同"],"ans":2,"a":"课件强调任务选择偏差；RDoC 维度配对是为了让两组的任务比较更公平。","p":96,"ep":107,"source":"L5A 第 2–3 页"},{"id":"5-mc-2","lesson":5,"kind":"mc","num":2,"q":"哪一组是课件所列 ASD 与 ADHD 共有的低活化脑区？","opts":["左额中回 MFG 与左颞上回 STG","右舌回与右直回","右脑岛与 PCC","左 MTG 与左 IPL"],"ans":0,"a":"共有低活化为左 MFG 和左 STG；B 为共有高活化，C 为 ADHD 特异高活化，D 为 ASD 特异高活化。","p":97,"ep":107,"source":"L5A 第 4–5 页"},{"id":"5-mc-3","lesson":5,"kind":"mc","num":3,"q":"Lou 研究中哪种“整体与局部”的关系符合资料？","opts":["全脑 FA 显著下降，但局部子网完全无差异","两组都没有小世界结构","读写障碍组所有白质束都显著受损","左侧局部子网较弱，而全脑平均 FA 无显著组间差异"],"ans":3,"a":"资料强调 8 节点 7 边局部子网及 FA 差异；全脑 FA p=.804，两组都保留小世界特征。","p":97,"ep":107,"source":"L5A 第 9–11 页"},{"id":"5-mc-4","lesson":5,"kind":"mc","num":4,"q":"哪一项主要衡量跨脑区长程信息整合？","opts":["CC 聚类系数","GE 全域效率","T 传递性","局部模块的互联密度"],"ans":1,"a":"GE 关注长程并行传输；CC、LE 和 T 更多描述局部组织或专门加工。","p":97,"ep":107,"source":"L5A 第 11 页"},{"id":"5-mc-5","lesson":5,"kind":"mc","num":5,"q":"哪项最符合认知–能量模型 CEM？","opts":["ADHD 个体在任何情境下都完全不能专注","只要诊断相同，工作记忆表现必然相同","表现会受事件速率、喚醒状态和即时反馈影响","所有困难都只来自一个不变的皮层区域"],"ans":2,"a":"CEM 强调能量状态与任务需求匹配，资料用慢节奏和即时奖赏说明情境依赖性。","p":97,"ep":107,"source":"L5A 第 18–19 页"},{"id":"5-mc-6","lesson":5,"kind":"mc","num":6,"q":"收到“现在按形状分类”的反馈后，仍反复按旧颜色规则分类，最符合什么？","opts":["固执性错误 PE","全域效率 GE","瞳孔透视误差 PFE","小世界参数 S"],"ans":0,"a":"PE 强调反馈已明确改变，却持续使用旧规则。","p":97,"ep":107,"source":"L5B 第 1 页、3"},{"id":"5-mc-7","lesson":5,"kind":"mc","num":7,"q":"哪一种理论最直接用“注意隧道”解释深度专注与转换代价？","opts":["认知储备","赫布理论","发育双重分离","单聚焦 Monotropism"],"ans":3,"a":"单聚焦强调注意高度投向单一目标；既可能带来深度优势，也会增加突然转换的代价。","p":97,"ep":108,"source":"L5B 第 5 页、17"},{"id":"5-mc-8","lesson":5,"kind":"mc","num":8,"q":"按课件，典型认知负荷增加时的 EEG 配对是？","opts":["Theta 下降，Alpha 必然升高","Theta 升高，Alpha 受抑即 ERD","Theta 和 Alpha 都是刺激后 300ms 的正向 ERP 波","Alpha 只能由 DTI 记录"],"ans":1,"a":"Theta 为 4–8Hz，Alpha 为 8–12Hz。P300 才是刺激后约 300ms 的 ERP 成分，DTI 测白质扩散。","p":98,"ep":108,"source":"L5B 第 8 页"},{"id":"5-mc-9","lesson":5,"kind":"mc","num":9,"q":"学生转眼看屏幕侧方，瞳孔图像变成椭圆而看似缩小，首先对应哪种测量问题？","opts":["双通路延迟厌恶","图式建构","瞳孔透视误差 PFE","真实负荷必然降低"],"ans":2,"a":"PFE 来自观察角度导致的形状与估计变化；不能把这次表观缩小直接当成真实负荷下降。","p":98,"ep":108,"source":"L5B 第 10 页"},{"id":"5-mc-10","lesson":5,"kind":"mc","num":10,"q":"下列哪一项符合资料中的全纳设计和伦理立场？","opts":["依据具体需要提供多种途径，同时不把当前脑图当成固定发展命运","同一诊断学生必须使用同一教案","把每个学生固定成视觉型或听觉型，再永远只用一种通道","为收集更多脑数据，可以不考虑儿童明显不适"],"ans":0,"a":"资料同时强调多样化支持、异质性、儿童舒适安全和拒绝神经决定论。","p":98,"ep":108,"source":"L5B 第 10 页、17–19"},{"id":"6-mc-1","lesson":6,"kind":"mc","num":1,"q":"学生可以选择写短文、画故事图或口述，展示对同一故事的理解。最直接对应 UDL 哪一原则？","opts":["多元表征","多元行动与表达","只按准备度分组","固定能力分层"],"ans":1,"a":"这里改变的是学生展示学习成果的方式；输入形式属于表征。","p":98,"ep":108,"source":"L6A 第 3 页"},{"id":"6-mc-2","lesson":6,"kind":"mc","num":2,"q":"根据资料，DI 调整教学时依据的是哪一组信息？","opts":["准备度、兴趣、学习概况","情感网络、识别网络、策略网络","基线脑电、潜伏期、波幅","学校规模、教师年龄、教室面积"],"ans":0,"a":"资料明确把准备度、兴趣和学习概况列为 DI 的调整依据。","p":98,"ep":108,"source":"L6A 第 4 页"},{"id":"6-mc-3","lesson":6,"kind":"mc","num":3,"q":"Griful-Freixenet 综述中，占比最高的 UDL 与 DI 关系是哪一种？","opts":["互补，37%","不相容，15%","嵌入，48%","三者各约三分之一"],"ans":2,"a":"资料列嵌入 48%、互补 37%、不相容 15%。","p":98,"ep":108,"source":"L6A 第 5 页"},{"id":"6-mc-4","lesson":6,"kind":"mc","num":4,"q":"哪项最符合资料对 Boysen 批判的解释？","opts":["缺少脑证据，所以所有课堂支架都无效","有脑区活动，所以三网络映射已获直接验证","有大量引文，所以无需检查引文内容","需要区分 UDL 神经依据是否充分与具体教学做法是否有效"],"ans":3,"a":"对神经依据的批判不能自动推出所有 UDL 实践无效，也不能用引文数量代替内容审查。","p":99,"ep":108,"source":"L6A 第 9–14 页"},{"id":"6-mc-5","lesson":6,"kind":"mc","num":5,"q":"哪一种支持安排最符合 Astle 的跨诊断观点？","opts":["只让拥有同一诊断的儿童进入任何小组","依据实际语音、记忆或执行功能需要组织支持","没有正式诊断就不提供课堂调整","默认同一诊断儿童需要完全相同的教法"],"ans":1,"a":"跨诊断强调功能需要和个体差异，而非以标签作为唯一组织原则。","p":99,"ep":108,"source":"L6A 第 15–20 页"},{"id":"6-mc-6","lesson":6,"kind":"mc","num":6,"q":"按 CALM 资料，哪一组是三个认知因素？","opts":["参与、表征、行动与表达","内容、过程、成果","语音加工、执行功能、加工速度","过度活跃、社会沟通、学习兴趣"],"ans":2,"a":"前三个认知因素不要与 UDL、DI 或同页五个困难维度混淆。","p":99,"ep":108,"source":"L6A 第 17 页"},{"id":"6-mc-7","lesson":6,"kind":"mc","num":7,"q":"Lotfi 研究中，哪项最符合资料报告的阅读结果？","opts":["即时阅读差异不显著，6 个月时训练组阅读较基线改善","即时所有阅读指标都显著提高，之后不再测量","训练只测脑电，没有阅读测验","阅读改善先于训练，在基线已经产生"],"ans":0,"a":"资料区分即时阅读结果与 6 个月后训练组相对基线的阅读改善，将后者解释为延迟迁移；不能改写成已报告 6 个月时的组间显著差异。","p":99,"ep":109,"source":"L6B 第 3–4 页"},{"id":"6-mc-8","lesson":6,"kind":"mc","num":8,"q":"按本课的解释，P3b 波幅与潜伏期分别用于讨论什么？","opts":["波幅讨论教师信心，潜伏期讨论课程可及性","波幅讨论语言兴趣，潜伏期讨论阅读偏好","二者都只说明处理速度","波幅讨论资源动员／容量，潜伏期讨论处理速度"],"ans":3,"a":"本题只考资料中的指标解释，不对有冲突的显著性或增幅作单选判断。","p":99,"ep":109,"source":"L6B 第 4–5 页"},{"id":"6-mc-9","lesson":6,"kind":"mc","num":9,"q":"PIT 四维度中，“支持所有学习者”在 Rusconi 研究中主要怎样操作化？","opts":["用 SCCI 测量成长型思维","用 TSR 评价教案与课堂可及性","用协同日志计算合作模式","用 SAED 测量全纳自我效能"],"ans":1,"a":"SCCI 对应重视多样性，日志对应协作，SAED 对应个人专业持续成长。","p":99,"ep":109,"source":"L6B 第 8 页"},{"id":"6-mc-10","lesson":6,"kind":"mc","num":10,"q":"把全班分成两组，两名教师按同一教学计划分别教学，资料称为什么？","opts":["一教一辅","一教一观察","平行教学","个别诊断"],"ans":2,"a":"平行教学强调两名教师同时承担教学；站点教学则通过不同任务站点轮换。","p":100,"ep":109,"source":"L6B 第 17 页"},{"id":"7-mc-1","lesson":7,"kind":"mc","num":1,"q":"NIES 四步骤的正确顺序是什么？","opts":["辨识神经原理→界定大脑功能属性→建立教学导向→发展课堂策略","具体策略→脑区诊断→学生分组→课程排名","神经原则→考试分数→功能属性→政策指令","功能属性→具体策略→神经原则→教师满意度"],"ans":0,"a":"NIES 先明确原则和功能含义，再转为教学取向与具体策略。","p":100,"ep":109,"source":"L7A 第 3–4 页"},{"id":"7-mc-2","lesson":7,"kind":"mc","num":2,"q":"按资料，点阵数量与实物多寡估算最直接对应哪项？","opts":["左 AG 的熟练事实提取","Broca 的内部语言计划","右 IPS 的非符号数量表征","左 IPS 的阿拉伯数字加工"],"ans":2,"a":"资料把非符号数量与右 IPS、符号化数量与左 IPS 联系。","p":100,"ep":109,"source":"L7A 第 9 页"},{"id":"7-mc-3","lesson":7,"kind":"mc","num":3,"q":"学生理解题意后，需要在心中用语言组织计算步骤。按资料最直接对应哪一项？","opts":["体感皮层的温度感觉","Broca 区相关的言语工作记忆与内部计划","右 IPS 的点阵估计","左 AG 的熟练事实提取"],"ans":1,"a":"资料把内部语言计划、言语工作记忆及步骤组织放在 Broca 相关功能中。","p":100,"ep":109,"source":"L7A 第 12 页"},{"id":"7-mc-4","lesson":7,"kind":"mc","num":4,"q":"哪一项最符合资料中的 Tier 3？","opts":["全员核心课程，每年评估 2–3 次","只做一次普遍筛查，之后不再追踪","任何学生都只提供同样的小组练习","密集个别化 IEP，评估每日至每周"],"ans":3,"a":"Tier 3 是最高强度的个别化支持，资料图示约 5%。","p":100,"ep":109,"source":"L7A 第 18–19 页"},{"id":"7-mc-5","lesson":7,"kind":"mc","num":5,"q":"DA 动态评估最关键的安排是什么？","opts":["比较测验、教学支持后再测验的表现","只记录第一次独立测验的分数","用诊断名称直接决定学生学习潜能","跳过教学，只比较不同学生排名"],"ans":0,"a":"DA 重在学生对支架的反应，采用 test–teach–test。","p":100,"ep":109,"source":"L7B 第 1 页"},{"id":"7-mc-6","lesson":7,"kind":"mc","num":6,"q":"哪一个学习顺序符合 CRA？","opts":["算式→积木→不再使用图示","只做口头背诵→只做限时测验","数棒等实物→点线图示→数字和算式","诊断标签→成绩排名→固定分组"],"ans":2,"a":"CRA 是 Concrete→Representational→Abstract。","p":101,"ep":109,"source":"L7B 第 2 页"},{"id":"7-mc-7","lesson":7,"kind":"mc","num":7,"q":"Garcia 课例中的渐进释放责任顺序是哪一项？","opts":["学生独立做→教师做→停止讨论","我做→我们做→你们一起做→你独立做","我们做→教师做→家长代做→学生观察","小组只模仿，不进入独立完成"],"ans":1,"a":"资料把支架从教师示范逐步转到学生合作和独立完成。","p":101,"ep":110,"source":"L7B 第 5 页"},{"id":"7-mc-8","lesson":7,"kind":"mc","num":8,"q":"让学生先获得一个小成功、在 2–3 项任务中选择、与同伴合作，分别主要支持 SDT 的什么需要？","opts":["控制、竞争、排名","记忆、感觉、反射","速度、准确、脑区定位","胜任感、自治感、关联感"],"ans":3,"a":"资料把小成功、适当选择与关系支持分别联系 SDT 三需要。","p":101,"ep":110,"source":"L7B 第 10 页"},{"id":"7-mc-9","lesson":7,"kind":"mc","num":9,"q":"关于 Thomas 调查中“76%”的说法，哪项最忠于资料？","opts":["在知晓教育神经科学的教师中，76%认为脑知识对教学有帮助","所有受访教师中，76%都参加过神经科学培训","76%的学生在培训后提高了数学成绩","76%的教师认为不需要实践指南"],"ans":0,"a":"资料明确把 76%的“有帮助”评价放在知晓该领域的教师中，不能改换对象。","p":101,"ep":110,"source":"L7B 第 15 页"},{"id":"7-mc-10","lesson":7,"kind":"mc","num":10,"q":"资料把科学视为“反思工具”，最符合哪种做法？","opts":["只要方法带有脑科学标签，就要求全校统一照做","用实验室结果取代教师所有情境判断","结合研究、具体学生及课堂效果调整支持，并让实践问题反馈给研究者","因为课堂复杂，所以不再评价教学成效"],"ans":2,"a":"反思工具强调证据与专业判断合作，既不机械命令，也不放弃检验。","p":101,"ep":110,"source":"L7B 第 16–18 页"},{"id":"8-mc-1","lesson":8,"kind":"mc","num":1,"q":"按 SETT 框架，选择工具前应先分析哪组三项？","opts":["价格、品牌、供应商","学生、环境、任务","EEG、fMRI、fNIRS","奖励、排名、惩罚"],"ans":1,"a":"SETT 的前三项是 Student、Environments、Tasks，第四项才是 Tools。","p":101,"ep":110,"source":"L8A 第 5 页"},{"id":"8-mc-2","lesson":8,"kind":"mc","num":2,"q":"哪项符合资料中的数字无障碍做法？","opts":["只把标题加粗即可取代标题层级","所有链接统一写“点击这里”","表格尽量合并所有单元格","为有信息作用的图片提供替代文本"],"ans":3,"a":"资料要求语义标题、描述性链接和图片替代文本，并反对影响读取的合并单元格。","p":102,"ep":110,"source":"L8A 第 4 页"},{"id":"8-mc-3","lesson":8,"kind":"mc","num":3,"q":"以下哪项属于被动 BCI 的典型用途？","opts":["隐式监测认知负荷并调整课件难度","有意识想象右手运动来驱动轮椅","主动注视目标字符完成拼写","通过头皮电流调节静息膜电位"],"ans":0,"a":"被动 BCI 在自然任务中读取状态并提供适应支持；B、C 是主动控制，D 是 tDCS。","p":102,"ep":110,"source":"L8A 第 15 页、17；L8B 第 1 页"},{"id":"8-mc-4","lesson":8,"kind":"mc","num":4,"q":"P300 拼写器所依赖的资料描述是？","opts":["血氧变化直接组成文字","阴极刺激诱发拼写","目标刺激后约 300 ms 出现正向电位","只读取手部肌肉收缩"],"ans":2,"a":"资料将 P300 与 Oddball 目标刺激后约 300 ms 的正向偏转相联系。","p":102,"ep":110,"source":"L8A 第 15 页"},{"id":"8-mc-5","lesson":8,"kind":"mc","num":5,"q":"19 项 BCI 研究的 TPACK 结果中，哪项正确？","opts":["PK 覆盖全部研究，TK 仅 1 项","TK 为 19/19，PK 为 1/19，CK 为 2/19","TK、PK、CK 均为 100%","CK 为 19/19，PK 为 2/19"],"ans":1,"a":"对应比例为 TK 100%、PK 约 5%、CK 约 11%，提示课程与教学法整合不足。","p":102,"ep":110,"source":"L8A 第 18 页"},{"id":"8-mc-6","lesson":8,"kind":"mc","num":6,"q":"按资料，tDCS 最直接的机制是什么？","opts":["直接诱发神经元动作电位","记录头皮电活动并解码","通过血氧变化估计脑活动","调节皮层静息膜电位"],"ans":3,"a":"资料明确说 tDCS 调节静息膜电位、不直接引发动作电位；B 是 EEG 记录/解码，C 属于血氧相关测量。","p":102,"ep":110,"source":"L8B 第 1 页；L8A 第 11 页、14"},{"id":"8-mc-7","lesson":8,"kind":"mc","num":7,"q":"对“6,587 次刺激未报告严重不良事件”，最符合资料范围的表述是？","opts":["纳入综述的研究在其条件下未报告严重不良事件","所有儿童在任何剂量下都不会有不良事件","研究没有任何轻微不适","该数字代表 6,587 名儿童完全治愈"],"ans":0,"a":"资料报告 745 名儿童青少年的累计刺激次数，并同时列出轻微反应和方法学局限。","p":102,"ep":110,"source":"L8B 第 1–3 页"},{"id":"8-mc-8","lesson":8,"kind":"mc","num":8,"q":"冷执行功能与热执行功能的正确配对是？","opts":["冷：延迟折扣；热：仅工作记忆","冷：风险奖赏；热：语音输出","冷：工作记忆与抑制；热：奖励与风险决策","二者只由同一类拼写任务区分"],"ans":2,"a":"资料把冷 EF 与工作记忆、抑制、灵活性联系，把热 EF 与延迟折扣和风险联系。","p":103,"ep":111,"source":"L8B 第 3–5 页"},{"id":"8-mc-9","lesson":8,"kind":"mc","num":9,"q":"智能自适应系统的三层正确顺序是？","opts":["决策层→感知层→反馈层","感知层→决策层→反馈层","反馈层→感知层→决策层","感知层→反馈层→决策层"],"ans":1,"a":"先感知状态，再由 AI 判断匹配与困难，最后调整支架，并继续构成闭环。","p":103,"ep":111,"source":"L8B 第 14 页"},{"id":"8-mc-10","lesson":8,"kind":"mc","num":10,"q":"监护人已同意，但学生持续抓挠设备并烦躁啼哭。按资料应怎样处理？","opts":["只看监护人签字，继续完成","用脑电排名惩罚拒绝行为","取消学生以后撤回的权利","尊重身体拒绝信号并终止相关干预"],"ans":3,"a":"资料强调动态同意与随时撤回，监护人授权不取消学生的拒绝信号。","p":103,"ep":111,"source":"L8B 第 17 页"},{"id":"9-mc-1","lesson":9,"kind":"mc","num":1,"q":"由混乱排版和无关装饰造成的心理消耗属于哪一种负荷？","opts":["外在认知负荷","材料固有的内在负荷","用于图式构建的有效负荷","只要与文字有关就全部是内在负荷"],"ans":0,"a":"资料把呈现不良及无效干扰列为外在负荷，应极小化。","p":103,"ep":111,"source":"L9A 第 5 页"},{"id":"9-mc-2","lesson":9,"kind":"mc","num":2,"q":"Santioso 研究在资料中的负荷结果是哪一项？","opts":["实验组的内在负荷被完全消除","实验组和对照组所有指标都无差异","只降低课程本身难度，没有改变呈现","实验组外在负荷降低，内在负荷组间无显著差异"],"ans":3,"a":"这说明资料所述设计减少无效消耗，而不是把核心内容降难。","p":103,"ep":111,"source":"L9A 第 6 页"},{"id":"9-mc-3","lesson":9,"kind":"mc","num":3,"q":"按资料，哪一种做法最符合必要难度？","opts":["让学生只反复看答案，始终不回想","不提供先备知识或支架，任务越难越好","安排适度费力、在支持下可完成的主动回想","用公开惩罚提高所有测验压力"],"ans":2,"a":"必要难度强调可克服的努力，不是无支架的过度困难。","p":103,"ep":111,"source":"L9B 第 1–2 页"},{"id":"9-mc-4","lesson":9,"kind":"mc","num":4,"q":"UDL 中“允许学生通过手偶、口述或图画展示理解”对应什么？","opts":["识别网络与多重表征","策略网络与多重表达","情感网络与单一奖励","固定学习风格分组"],"ans":1,"a":"展示学习成果属于 How 及策略网络，多重表达提供不同输出路径。","p":104,"ep":111,"source":"L9B 第 6 页"},{"id":"9-mc-5","lesson":9,"kind":"mc","num":5,"q":"CIRCLE 五层从内到外的正确顺序是？","opts":["技能→教学→基础→认知→社会情感","情感→技能→基础→教学→认知","认知→基础→技能→情感→教学","基础→社会情感→认知→教学→技能"],"ans":3,"a":"资料主表及正文都保留这一五层顺序，细部层名在图与文字中另有表述。","p":104,"ep":111,"source":"L9A 第 14 页、17–19"},{"id":"9-mc-6","lesson":9,"kind":"mc","num":6,"q":"按 L9B p.4 图示，六步循环中“主动加工”之后是什么？","opts":["动态诊断","监控校准","分布提取","形成反馈"],"ans":2,"a":"六步依次为动态诊断、教学适配、主动加工、分布提取、形成反馈、监控校准。","p":104,"ep":111,"source":"L9B 第 4 页"},{"id":"9-mc-7","lesson":9,"kind":"mc","num":7,"q":"资料建议线上与线下怎样分工？","opts":["仅按上课日期随机分配","面授承担复杂互动与情感支持；线上承担个体化异步提取与反思","线上负责一切复杂社交，线下只重复个人点击","全部交给点击流算法决定，教师不再判断"],"ans":1,"a":"资料强调认知编排，根据各环境的功能安排任务，并保留教师专业判断。","p":104,"ep":111,"source":"L9B 第 4–5 页"},{"id":"9-mc-8","lesson":9,"kind":"mc","num":8,"q":"Jhuo & Chu 研究第二轮加入点读笔，主要解决什么问题？","opts":["让幼儿在教师不一直陪同时仍可反复获得语音规则和朗读","把低难度教具重新锁入隔离柜","让所有幼儿只能书面作答","取消所有同伴合作"],"ans":0,"a":"第一轮后持续独立活动仍不足，点读笔提供可自主重复的语音引导。","p":104,"ep":111,"source":"L9B 第 8 页"},{"id":"9-mc-9","lesson":9,"kind":"mc","num":9,"q":"CPA 中正确的顺序是哪项？","opts":["抽象→实物→图示","图示→抽象→实物","实物→图示→抽象","实物→抽象→图示"],"ans":2,"a":"资料明确用 Concrete、Pictorial、Abstract 表示从操作到图示再到符号。","p":104,"ep":112,"source":"L9B 第 13 页"},{"id":"9-mc-10","lesson":9,"kind":"mc","num":10,"q":"哪项属于资料提出的普特协同支柱？","opts":["把所有改编工作交给普通教师独自完成","基于数据的双周研讨和共同反思迭代","根据一次测验永久固定学生层次","只采购昂贵设备，取消共同备课"],"ans":1,"a":"五支柱包括互信、共同价值、合理分工、双周研讨及共同反思。","p":105,"ep":112,"source":"L9B 第 15 页"}]</script>

<script>
'use strict';
const bank=JSON.parse(document.querySelector('#bank').textContent);

const titles={4:'神经多样性与神经可塑性',5:'学习障碍的神经关联机制',6:'全纳教育策略与证据审查',7:'从脑科学到特殊教育实操',8:'技术创新与神经伦理',9:'基于大脑的课程设计'};
const types={all:'混合练习',flash:'速记',mc:'选择',short:'简答'};
const lessons=Object.keys(titles).map(Number), app=document.querySelector('#app');
const storageKey='psy6094.study.v1';

try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&saved.sessions&&saved.records&&saved.first)Object.assign(state,saved)}catch{document.querySelector('#storage').hidden=false}
let screen='home', chapter=state.last, filter='all', activeKey=null, report=null;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{document.querySelector('#storage').hidden=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function btn(label,action,style='primary',attr=''){return '<button class="'+style+'" data-action="'+action+'" '+attr+'>'+esc(label)+'</button>'}
function record(id){return state.records[id]||{}}
function weak(q){return ['miss','partial'].includes(record(q.id).status)}
function pool(l,k='all'){return bank.filter(q=>q.lesson===l&&(k==='all'||q.kind===k))}
function counters(qs){return {good:qs.filter(q=>record(q.id).status==='good').length,weak:qs.filter(weak).length,fresh:qs.filter(q=>!record(q.id).status).length}}
function stat(n,label){return '<div class="stat"><b>'+n+'</b><span>'+label+'</span></div>'}
function source(q){let p=q.p+(q.end&&q.end!==q.p?'–'+q.end:'');return '<p class="source">'+pdfLink(q.p,'复习册第 '+p+' 页')+(q.ep?' · 解析第 '+q.ep+' 页':'')+'　｜　老师资料 '+esc(q.source)+'</p>'}
function turn(page){screen=page;render();window.scrollTo(0,0);app.focus({preventScroll:true})}
function stars(){return Object.values(state.records).filter(x=>x.star).length}
function current(){return state.sessions[activeKey]}
function dots(n,i){return '<div class="dots" aria-hidden="true">'+Array.from({length:n},(_,j)=>'<i class="'+(j<i?'on':'')+'"></i>').join('')+'</div>'}
function back(){return '<div class="rail">'+btn('返回首页','home','back')+'<span class="star">★ '+stars()+' 颗攻克星</span></div>'}
function lessonRows(l){return ['flash','mc','short'].map(k=>'<div class="maprow"><span>'+types[k]+'</span><div class="cells">'+pool(l,k).map(q=>'<i class="cell" data-s="'+(record(q.id).status||'')+'"></i>').join('')+'</div></div>').join('')}
function home(){
 const s=state.sessions[state.lastKey], review=s?.mode==='weak', l=s?.lesson||state.last, c=counters(pool(l));
 const nextLabel=s?(s.phase==='study'?'继续看知识卡':'继续闯关'):state.first[l]?'开始复习':'开始学习';
 const weakN=bank.filter(weak).length;
 return '<section class="hero"><div class="herocopy"><div class="eyebrow">'+(review?'错题回练':'第 '+l+' 课 · '+(state.first[l]?'直接闯关':'首次学习'))+'</div><h1>'+(review?'把漏掉的题再答一遍':titles[l])+'</h1><p>'+(s?(s.phase==='study'?'上次看到第 '+(s.preview+1)+' 张知识卡。':'本轮进度已保存，可以接着作答。'):state.first[l]?'每轮 10 题，先回忆，再核对。':'先背 5 张知识卡，再做 10 道练习。')+'</p><div class="actions">'+btn(nextLabel,'continue','white')+btn('复习错题 · '+weakN,'mistakes','outline')+'</div></div>'+sticker('shaun','hero-sheep')+'<aside class="map"><div class="maplead"><strong>'+c.good+' / 30</strong><span>第 '+l+' 课已掌握</span></div>'+lessonRows(l)+'</aside></section><div class="heading"><h2>按课选题</h2><span>6 课 · 180 题</span></div><div class="grid">'+lessons.map(l=>{let c=counters(pool(l));return '<button class="lesson" data-action="chapter" data-l="'+l+'"><div class="lessonTop">第 '+l+' 课'+(lessonLit(l)?'<span class="lit">★ 已通关</span>':'<i></i>')+'</div><h3>'+titles[l]+'</h3><div class="meta">掌握 '+c.good+'　待巩固 '+c.weak+'　生题 '+c.fresh+'</div><div class="track"><i style="width:'+100*c.good/30+'%"></i></div></button>'}).join('')+'</div><div class="heading"><h2>我的攻克星</h2><span class="star">★ '+stars()+' 颗</span></div><p class="soft">曾经漏答的题，之后独立答全，就能点亮一颗星。每题点亮一次。</p>'
}
function chooseChapter(){
 let qs=pool(chapter,filter),c=counters(qs),s=state.sessions[chapter+'-'+filter];
 return '<div class="viewer">'+back()+'<section class="sheet"><div class="kindlbl">第 '+chapter+' 课</div><h1>'+titles[chapter]+'</h1><div class="pills" aria-label="选择题型">'+Object.entries(types).map(([k,v])=>btn(v,'filter',k===filter?'active':'','data-k="'+k+'" aria-pressed="'+(k===filter)+'"')).join('')+'</div><div class="overview">'+stat(c.fresh,'生题')+stat(c.weak,'待巩固')+stat(c.good,'已掌握')+'</div><p class="soft">'+(s?'本题型有未完成的练习。':state.first[chapter]?'本课已完成首次学习，复习将直接出题。':'首次进入本课，先学本轮的 5 张卡，再闯关。')+'</p><div class="actions">'+btn(s?'接着上次练习':state.first[chapter]?'直接闯关':'先看知识卡','start')+btn('思维导图','mind','secondary')+btn('知识点地图','atlas','secondary')+'</div>'+examBanner(chapter)+'</section></div>'
}
function weakScreen(){
 let qs=bank.filter(weak);return '<div class="viewer">'+back()+'<section class="sheet"><div class="kindlbl">错题回练</div><h1>'+ (qs.length?'待巩固的 '+qs.length+' 道题':'错题本还是空的')+'</h1><p class="soft">'+(qs.length?'作答后漏掉的题会留在这里，独立答全即可移出。':'选错、漏答或用过提示的题会自动收进这里。')+'</p><div class="actions">'+(qs.length||state.sessions.weak?btn(state.sessions.weak?'继续回练':'开始回练','startWeak'):btn('去学习','home'))+'</div>'+qs.map(q=>'<div class="listitem"><small class="meta">第 '+q.lesson+' 课 · '+types[q.kind]+'</small><p>'+esc(q.q)+'</p></div>').join('')+'</section></div>'
}
const starterMc={4:[2,3,4],5:[1,2,4],6:[1,2,3],7:[1,4,5],8:[1,3,6],9:[1,5,6]},starterShort={4:[3,4],5:[1,3],6:[1,2],7:[1,5],8:[1,3],9:[1,4]};
function plan(l,k){
 let qs=pool(l,k);
 if(k!=='all')return qs.slice().sort(priority).map(q=>q.id);
 const flash=pool(l,'flash'),mc=pool(l,'mc'),short=pool(l,'short'),m=starterMc[l],h=starterShort[l];
 const first=[flash[0],mc[m[0]-1],flash[1],short[h[0]-1],flash[2],mc[m[1]-1],flash[3],short[h[1]-1],flash[4],mc[m[2]-1]];
 const order=[...first];for(let i=0;i<10;i++)for(const a of [flash,mc,short])if(!order.includes(a[i]))order.push(a[i]);
 return order.sort(priority).slice(0,10).map(q=>q.id);
}
function priority(a,b){
 const r=record(a.id),t=record(b.id);
 const group=x=>!x.status?0:x.status==='good'?2:1;
 return group(r)-group(t)||(r.last||0)-(t.last||0)
}
function emptyResponse(){return {text:'',pick:null,revealed:false,usedHint:false,checked:[],graded:null,won:false}}
function start(l,k,mode){
 activeKey=mode==='weak'?'weak':l+'-'+k;
 if(!state.sessions[activeKey]){
  const ids=mode==='weak'?bank.filter(weak).sort(priority).slice(0,10).map(q=>q.id):plan(l,k);
  if(!ids.length){turn('weak');return}
  const learn=mode!=='weak'&&!state.first[l];
  const cards=learn?(k==='all'?ids.filter(id=>byId[id].kind==='flash').slice(0,5):ids.slice(0,5)):[];
  for(const id of ids)if(learn&&cards.length<5&&!cards.includes(id))cards.push(id);
  state.sessions[activeKey]={lesson:l,mode,phase:learn?'study':'quiz',preview:0,cards,total:ids.length,queue:ids.map(id=>({id,retry:false})),index:0,initial:{},starCount:0,response:emptyResponse()};
 }
 if(mode!=='weak')state.last=l;
 state.lastKey=activeKey;resume(activeKey)
}
function resume(key){activeKey=key;const s=current();if(s.phase==='study'&&state.first[s.lesson])s.phase='quiz';save();turn('session')}
function study(s){
 const q=byId[s.cards[s.preview]];
 const content=q.kind==='short'?'<ol>'+q.points.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ol>':esc(q.kind==='mc'?q.opts[q.ans]+'。'+q.a:q.a);
 return '<div class="rail"><span class="kindlbl">第 '+q.lesson+' 课 · 知识卡</span><span>'+(s.preview+1)+' / '+s.cards.length+'</span></div>'+dots(s.cards.length,s.preview+1)+'<section class="sheet"><h1>'+esc(q.q)+'</h1><div class="studybody">'+content+'</div>'+(q.hook?'<p class="spaced soft">记法　'+esc(q.hook)+'</p>':'')+source(q)+'<div class="actions">'+(s.preview>0?btn('上一张','prev','secondary'):'')+btn(s.preview===s.cards.length-1?'背好了，开始闯关':'下一张知识卡','studyNext')+'</div></section>'
}
function quiz(s){
 const step=s.queue[s.index],q=byId[step.id],r=s.response;
 const num=s.queue.slice(0,s.index+1).filter(x=>!x.retry).length;
 let body='<div class="rail"><span class="kindlbl">第 '+q.lesson+' 课 · '+types[q.kind]+'</span><span>'+(step.retry?'错题回练 · ':'')+'第 '+num+' / '+s.total+' 题</span></div>'+dots(s.total,num)+'<section class="sheet"><h1>'+esc(q.q)+'</h1>';
 if(q.kind==='mc'){
  body+='<div class="options" role="group" aria-label="选择一个答案">'+q.opts.map((option,i)=>{
   let cls='option',mark='';
   if(r.pick===i)cls+=' selected';
   if(r.revealed){if(i===q.ans){cls+=' correct';mark='正确答案'}else if(i===r.pick){cls+=' wrong';mark='你的选择'}}
   return btnOption(i,option,cls,mark,r)
  }).join('')+'</div>';
  if(r.revealed)body+='<div class="feedback '+(r.pick===q.ans?'':'bad')+'"><b class="title">'+(r.pick===q.ans?'答对了':'这道题已收入错题本')+'</b>'+esc(q.a)+'</div>';
  else body+='<div class="actions">'+btn('提交答案','reveal','primary',r.pick===null?'disabled':'')+'</div>';
 }else if(!r.revealed){
  body+='<label class="entry">我的回答<textarea id="draft" placeholder="写下想到的关键词，也可以先口答再揭晓。">'+esc(r.text)+'</textarea></label>';
  if(q.kind==='short'&&r.usedHint)body+='<div class="hint">提示词　'+esc(q.hint)+'</div>';
  body+='<div class="actions">'+btn('揭晓参考答案','reveal')+(q.kind==='short'&&!r.usedHint?btn('看一次提示','hint','secondary'):'')+'</div>';
 }else{
  const my='<div class="mine"><b class="title">我的回答</b>'+esc(r.text||'已口头作答')+'</div>';
  if(q.kind==='short'){
   body+='<div class="compare">'+my+'<div class="answer"><b class="title">逐项勾选你答到的要点</b><div class="checks">'+q.points.map((p,i)=>'<label><input type="checkbox" data-point="'+i+'" '+(r.checked.includes(i)?'checked ':'')+(r.graded?'disabled':'')+'><span>'+esc(p)+'</span></label>').join('')+'</div></div></div>';
   if(!r.graded)body+='<div class="actions">'+btn('完成核对','rateShort')+'<span class="meta" id="checkCount">已勾选 '+r.checked.length+' / '+q.points.length+' 项</span></div>';
  }else{
   body+='<div class="compare">'+my+'<div class="answer"><b class="title">参考要点</b>'+esc(q.a)+'</div></div>';
   if(!r.graded)body+='<p class="soft">对照要点，这次回忆得怎么样？</p><div class="actions">'+btn('独立答全','rate','primary','data-grade="good"')+btn('漏了一点','rate','secondary','data-grade="partial"')+btn('没想起来','rate','secondary','data-grade="miss"')+'</div>'
  }
 }
 if(r.revealed)body+=source(q);
 if(r.graded){
  let message=r.won?'★ 点亮一颗攻克星':r.usedHint?'用过提示，已标记为待巩固':r.graded==='good'?'已记录 · 独立答全':r.graded==='partial'?'已记录 · 漏了一点':'已记录 · 需要再练';
  body+='<div class="actions">'+btn(s.index===s.queue.length-1?'查看本轮小结':'下一题','next')+'<span class="'+(r.won?'star':'soft')+'" role="status">'+message+'</span></div>';
 }
 return body+'</section>'
}
function btnOption(i,option,cls,mark,r){
 return '<button class="'+cls+'" data-action="pick" data-i="'+i+'" aria-pressed="'+(r.pick===i)+'" '+(r.revealed?'disabled':'')+'><i>'+String.fromCharCode(65+i)+'</i><span>'+esc(option)+'</span>'+(mark?'<span class="optmark">'+mark+'</span>':'')+'</button>'
}
function grade(s,result){
 const r=s.response;if(r.graded)return;
 if(r.usedHint&&result==='good')result='partial';
 const step=s.queue[s.index],prev=record(step.id),won=result==='good'&&!!prev.wasWeak&&!prev.star;
 state.records[step.id]={status:result,wasWeak:!!prev.wasWeak||result!=='good',star:!!prev.star||won,last:Date.now()};
 r.graded=result;r.won=won;if(won)s.starCount++;
 if(!step.retry){
  s.initial[step.id]=result;
  if(result!=='good'&&s.queue.slice(s.index+1).filter(x=>x.id!==step.id).length>=2){
   s.queue.splice(s.index+3,0,{id:step.id,retry:true})
  }
 }
 save()
}
function finished(){
 const c=report.results;
 return '<div class="viewer">'+back()+'<section class="sheet"><div class="kindlbl">本轮小结</div><h1>完成 '+report.total+' 道练习</h1><p class="soft">以下是每道题首次作答的表现。</p><div class="overview">'+stat(c.good,'独立答全')+stat(c.partial,'漏点或用过提示')+stat(c.miss,'需要再练')+'</div><p class="star">★ 本轮点亮 '+report.stars+' 颗攻克星</p><div class="actions">'+(bank.some(weak)?btn('复习错题','mistakes'):'')+btn('返回首页','home','secondary')+'</div></section></div>'
}
function render(){
 document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('selected',el.dataset.page===screen));
 if(screen==='mind')app.innerHTML=mindScreen();
 if(screen==='atlas')app.innerHTML=mapScreen();
 if(screen==='point')app.innerHTML=pointScreen();
 if(screen==='exam')app.innerHTML=examScreen();
 if(screen==='examResult')app.innerHTML=examResult();
 if(screen==='home')app.innerHTML=home();
 if(screen==='chapter')app.innerHTML=chooseChapter();
 if(screen==='weak')app.innerHTML=weakScreen();
 if(screen==='summary')app.innerHTML=finished();
 if(screen==='session'){const s=current();app.innerHTML='<div class="viewer">'+back()+(s.phase==='study'?study(s):quiz(s))+'</div>'}
}
function nextStep(s){
 if(s.index+1<s.queue.length){s.index++;s.response=emptyResponse();save();turn('session');return}
 const results={good:0,partial:0,miss:0};
 for(const g of Object.values(s.initial))results[g]++;
 report={results,stars:s.starCount,total:s.total};
 delete state.sessions[activeKey];
 state.lastKey=Object.keys(state.sessions).at(-1)||null;
 save();turn('summary')
}
const resetDialog=document.querySelector('#resetDialog');
document.querySelector('.site-nav').onclick=e=>{
 const link=e.target.closest('button[data-page]');
 if(link)handleAtlasAction(link.dataset.page,{});
};
document.querySelector('#resetOpen').onclick=()=>resetDialog.showModal();
document.querySelector('#resetCancel').onclick=()=>resetDialog.close();
document.querySelector('#resetConfirm').onclick=()=>{
 state=freshState();chapter=6;filter='all';activeKey=null;report=null;pointId=null;mini=null;
 atlasLesson=6;atlasBranch=0;pointFilter='all';pointStep='read';
 save();resetDialog.close();turn('home');document.querySelector('#notice').textContent='学习进度已重置。';
};
// A reset or a finished exam in another tab must invalidate the old view here.
window.addEventListener('storage',event=>{
 if(event.key!==storageKey)return;
 try{state=Object.assign(freshState(),JSON.parse(event.newValue)||{})}catch{return}
 const invalid=(screen==='session'&&!current())||(screen==='exam'&&!state.exams[atlasLesson])||
   (screen==='examResult'&&!state.examHistory[atlasLesson])||(screen==='point'&&!state.points[pointId])||
   (screen==='summary'&&!Object.keys(state.records).length);
 if(invalid)turn('home');else render();
});
document.querySelector('#brand').onclick=()=>turn('home');
app.addEventListener('input',e=>{
 if(e.target.id==='draft'&&current()){current().response.text=e.target.value;save()}
});
app.addEventListener('change',e=>{
 if(!e.target.matches('[data-point]'))return;
 const r=current().response,i=Number(e.target.dataset.point);if(r.graded)return;
 r.checked=r.checked.filter(x=>x!==i);if(e.target.checked)r.checked.push(i);
 const q=byId[current().queue[current().index].id];
 document.querySelector('#checkCount').textContent='已勾选 '+r.checked.length+' / '+q.points.length+' 项';save()
});
app.addEventListener('click',e=>{
 const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;
 const act=el.dataset.action;
 if(handleAtlasAction(act,el.dataset))return;
 if(act==='home'){turn('home');return}
 if(act==='chapter'){chapter=Number(el.dataset.l);filter='all';turn('chapter');return}
 if(act==='filter'){filter=el.dataset.k;render();return}
 if(act==='mistakes'){turn('weak');return}
 if(act==='startWeak'){start(state.last,'all','weak');return}
 if(act==='start'){start(chapter,filter,'chapter');return}
 if(act==='continue'){
  if(state.sessions[state.lastKey]){resume(state.lastKey)}else start(state.last,'all','chapter');return
 }
 const s=current();if(!s)return;
 if(s.phase==='study'){
  if(act==='prev')s.preview=Math.max(0,s.preview-1);
  if(act==='studyNext'){if(s.preview+1<s.cards.length)s.preview++;else{s.phase='quiz';state.first[s.lesson]=true}}
  save();turn('session');return
 }
 const r=s.response,q=byId[s.queue[s.index].id];
 if(act==='next'&&r.graded){nextStep(s);return}
 if(act==='pick'&&!r.revealed){r.pick=Number(el.dataset.i);save();render();app.querySelector('[data-action="pick"][data-i="'+r.pick+'"]').focus();return}
 if(act==='hint'&&!r.revealed)r.usedHint=true;
 if(act==='reveal'&&!r.revealed){
  if(q.kind==='mc'&&r.pick===null)return;
  r.revealed=true;if(q.kind==='mc')grade(s,r.pick===q.ans?'good':'miss')
 }
 if(act==='rate'&&r.revealed&&q.kind==='flash')grade(s,el.dataset.grade);
 if(act==='rateShort'&&r.revealed&&q.kind==='short')grade(s,r.checked.length===q.points.length?'good':r.checked.length?'partial':'miss');
 save();render()
});
render();
</script>
</body>
